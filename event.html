nt-weight:700;margin-bottom:10px}h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(42px,7vw,72px);line-height:.92;background:linear-gradient(100deg,#fff 20%,var(--cyan) 55%,var(--magenta) 85%);-webkit-background-clip:text;background-clip:text;color:transparent}.lead{color:var(--muted);font-size:13px;margin:14px 0 20px}.details{display:grid;gap:10px}.detail{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(8,6,13,.38)}.detail small{display:block;color:var(--muted);font-size:8px;letter-spacing:.15em;text-transform:uppercase;margin-bottom:3px}.detail strong{font-size:12.5px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.btn{display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;border-radius:11px;font-size:11px;font-weight:700}.buy{background:var(--ink);color:#0a0812}.buy:hover{background:var(--cyan)}.map{border:1px solid rgba(63,224,208,.35);color:var(--cyan);background:rgba(63,224,208,.06)}.map:hover{border-color:var(--cyan);background:rgba(63,224,208,.12)}.countdown{margin-top:18px;display:flex;gap:7px;flex-wrap:wrap}.cd{min-width:55px;padding:8px;border:1px solid rgba(63,224,208,.18);border-radius:9px;text-align:center;background:rgba(8,6,13,.4)}.cd b{display:block;font-family:'Bebas Neue';font-size:22px;color:var(--cyan);line-height:1}.cd span{font-size:7px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}footer{border-top:1px solid var(--line);padding:24px 0;text-align:center;color:var(--muted);font-size:10px}@media(max-width:760px){.event-hero{grid-template-columns:1fr}.poster img{min-height:360px}.actions{grid-template-columns:1fr}.nav{padding:12px 18px}.coupon{font-size:8px}}
