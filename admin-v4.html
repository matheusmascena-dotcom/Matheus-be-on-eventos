<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BeOn Admin V4</title><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;background:#06040b;color:#f5f0fa;font:14px/1.5 'Space Grotesk',sans-serif}.wrap{max-width:1120px;margin:auto;padding:24px}.box{background:#120d1b;border:1px solid #ffffff18;border-radius:18px;padding:20px;margin-top:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input,textarea,select{width:100%;box-sizing:border-box;padding:11px;border-radius:10px;border:1px solid #ffffff18;background:#08060d;color:#fff}button{padding:10px 13px;border:1px solid #ffffff18;background:#ffffff08;color:#fff;border-radius:9px;cursor:pointer}.primary{background:#f5f0fa;color:#090711;border:0}.muted{color:#a49ab5;font-size:12px}.status{color:#3fe0d0;font-size:12px;min-height:18px}.error{color:#ff7cae}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button.active{border-color:#3fe0d0;color:#3fe0d0}.hidden{display:none}.cards{display:grid;gap:9px}.item{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:10px;border:1px solid #ffffff12;border-radius:10px}.thumbs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.thumb{border:1px solid #ffffff12;border-radius:10px;padding:7px;background:#0b0812}.thumb img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{padding:14px;border:1px solid #ffffff12;border-radius:12px}.kpi b{font:32px 'Bebas Neue';display:block}.login-box{max-width:520px;margin:50px auto}.login-actions{display:flex;justify-content:flex-end;margin-top:10px}.help{font-size:11px;color:#8f859d;margin-top:8px}@media(max-width:820px){.grid{grid-template-columns:1fr}.item{grid-template-columns:1fr}.thumbs{grid-template-columns:repeat(3,1fr)}.kpis{grid-template-columns:1fr 1fr}}@media(max-width:480px){.kpis{grid-template-columns:1fr}.wrap{padding:16px}}</style></head><body><main class="wrap"><div class="row" style="justify-content:space-between"><div><div style="color:#3fe0d0">BE·ON CMS V4</div><h1 style="font:48px 'Bebas Neue';margin:0">Painel administrativo</h1><div id="msg" class="muted">Faça login para gerenciar o site.</div></div><div class="row"><a href="index.html" style="color:#3fe0d0">← Site</a><button id="logoutTop" class="hidden">Sair</button></div></div><section id="login" class="box login-box"><form id="loginForm"><div class="grid" style="grid-template-columns:1fr"><input id="email" autocomplete="username" placeholder="E-mail" type="email" required><input id="pass" autocomplete="current-password" placeholder="Senha" type="password" required></div><div class="login-actions"><button class="primary" id="enter" type="submit">Entrar</button></div><div id="loginError" class="error" style="margin-top:10px;min-height:18px"></div><div class="help">A autenticação usa o Supabase Auth. Nada da sua senha fica gravado no GitHub.</div></form></section><section id="app" class="hidden"><div class="tabs box"><button data-tab="events" class="active">Eventos</button><button data-tab="gallery">Galerias</button><button data-tab="sheet">Planilha</button><button data-tab="metrics">Métricas</button></div><div id="panel" class="box"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://bellpluuhrrluwsgouob.supabase.co';
const SUPABASE_KEY='sb_publishable_oQq38KO1A-4mZttQVL6O-g__RZKKIGX';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));let tab='events',editing=null;
function setMsg(t,err=false){$('msg').textContent=t;$('msg').className=err?'error':'muted'}function setLoginError(t=''){$('loginError').textContent=t}
async function init(){const {data,error}=await sb.auth.getSession();if(error){setLoginError(error.message);return}if(data.session)enterApp()}function enterApp(){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('logoutTop').classList.remove('hidden');setMsg('Login ativo.');renderTab()}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();setLoginError('');const b=$('enter');b.disabled=true;b.textContent='Entrando...';try{const r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('pass').value});if(r.error)throw r.error;enterApp()}catch(err){setLoginError(err?.message||'Falha ao autenticar.')}finally{b.disabled=false;b.textContent='Entrar'}});
$('logoutTop').onclick=async()=>{await sb.auth.signOut();location.reload()};sb.auth.onAuthStateChange((_e,s)=>{if(s)enterApp()});
async function loadEvents(){const r=await sb.from('events').select('*').order('event_date');if(r.error){setMsg(r.error.message,true);return[]}return r.data||[]}
async function showEvents(){const data=await loadEvents();$('panel').innerHTML='<div class="row" style="justify-content:space-between"><h2>Eventos</h2><button id="new" class="primary">+ Novo evento</button></div><div id="eventlist" class="cards" style="margin-top:12px"></div><div id="form"></div>';const list=$('eventlist');list.innerHTML=data.map(e=>`<div class="item"><div><b>${esc(e.name)}</b><div class="muted">${esc(e.event_date||'')} · ${esc(e.location||'')} · ${e.published?'Publicado':'Oculto'}</div></div><button data-edit="${e.id}">Editar</button><button data-pub="${e.id}">${e.published?'Ocultar':'Publicar'}</button><button data-del="${e.id}">Excluir</button></div>`).join('');list.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>form(data.find(e=>e.id===b.dataset.edit)));list.querySelectorAll('[data-pub]').forEach(b=>b.onclick=async()=>{const e=data.find(x=>x.id===b.dataset.pub);await sb.from('events').update({published:!e.published,updated_at:new Date().toISOString()}).eq('id',e.id);showEvents()});list.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('Excluir este evento?')){await sb.from('events').delete().eq('id',b.dataset.del);showEvents()}});$('new').onclick=()=>form({})}
function form(e){editing=e.id||null;$('form').innerHTML=`<div class="box"><div class="grid"><input id="n" placeholder="Nome" value="${esc(e.name)}"><input id="d" type="date" value="${esc(e.event_date)}"><input id="l" placeholder="Local" value="${esc(e.location)}"><input id="a" placeholder="Artistas" value="${esc(e.artists)}"><input id="b" placeholder="Link de compra" value="${esc(e.purchase_url)}"><input id="i" placeholder="URL da capa" value="${esc(e.image_url)}"><input id="m" placeholder="Pasta Drive / fonte" value="${esc(e.source_url)}"><select id="p"><option value="true" ${e.published===false?'':'selected'}>Publicado</option><option value="false" ${e.published===false?'selected':''}>Oculto</option></select></div><textarea id="desc" placeholder="Descrição" style="margin-top:10px;min-height:100px">${esc(e.description)}</textarea><div class="row" style="margin-top:10px"><button id="save" class="primary">Salvar</button><button id="cancel">Cancelar</button></div></div>`;$('cancel').onclick=showEvents;$('save').onclick=async()=>{const name=$('n').value.trim();if(!name)return;const slug=name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');const row={name,event_date:$('d').value,location:$('l').value,artists:$('a').value,purchase_url:$('b').value,image_url:$('i').value,source_url:$('m').value,description:$('desc').value,published:$('p').value==='true',slug,updated_at:new Date().toISOString()};const r=editing?await sb.from('events').update(row).eq('id',editing):await sb.from('events').insert(row);if(r.error){setMsg(r.error.message,true);return}setMsg('Evento salvo.');showEvents()}}
async function showGallery(){const events=await loadEvents();$('panel').innerHTML=`<h2>Galerias</h2><select id="ge">${events.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select><div class="grid" style="margin-top:10px"><input id="gf" type="file" accept="image/*" multiple><input id="cr" placeholder="Crédito / fotógrafo"><input id="cu" placeholder="Instagram do fotógrafo"></div><div class="row" style="margin-top:10px"><button id="up" class="primary">Enviar fotos</button><span id="galleryStatus" class="muted"></span></div><div id="photos" class="thumbs" style="margin-top:12px"></div>`;const refresh=async()=>{const r=await sb.from('event_gallery_photos').select('*').eq('event_id',$('ge').value).order('position');$('photos').innerHTML=(r.data||[]).map(p=>`<div class="thumb"><img src="${esc(p.src_url)}" loading="lazy"><div class="muted">#${p.position+1} ${p.is_featured?'· destaque':''}</div><button data-x="${p.id}" style="width:100%;margin-top:6px">Excluir</button></div>`).join('');document.querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{await sb.from('event_gallery_photos').delete().eq('id',b.dataset.x);refresh()})};$('ge').onchange=refresh;$('up').onclick=async()=>{const id=$('ge').value,files=[...$('gf').files];if(!files.length)return;$('up').disabled=true;try{const q=await sb.from('event_gallery_photos').select('id',{count:'exact',head:true}).eq('event_id',id);let pos=q.count||0;for(const f of files){const path=`${id}/${Date.now()}-${f.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const u=await sb.storage.from('event-media').upload(path,f,{upsert:false});if(u.error)continue;const url=sb.storage.from('event-media').getPublicUrl(path).data.publicUrl;await sb.from('event_gallery_photos').insert({event_id:id,src_url:url,photo_name:f.name,credit_label:$('cr').value,credit_url:$('cu').value,position:pos,is_featured:pos<8});pos++}$('galleryStatus').textContent='Fotos enviadas.';refresh()}finally{$('up').disabled=false}};refresh()}
async function showSheet(){$('panel').innerHTML='<h2>Sincronizar planilha</h2><p class="muted">A aba Página1 atualiza eventos e Configurações do Site atualiza as configurações.</p><input id="sheet" type="file" accept=".xlsx,.xls"><div id="sheetStatus" class="status" style="margin-top:10px"></div>';$('sheet').onchange=async()=>{const f=$('sheet').files[0];if(!f)return;try{if(!window.XLSX)await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)});const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),sn=wb.SheetNames.find(x=>x.toLowerCase().includes('página1'))||wb.SheetNames[0],rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:''}),cn=wb.SheetNames.find(x=>x.toLowerCase().includes('configura')),cr=cn?XLSX.utils.sheet_to_json(wb.Sheets[cn],{defval:''}):[],config={};cr.forEach(r=>{const k=r['Configuração']??r['configuração'],v=r['Valor']??r['valor'];if(k)config[k]=v});const events=rows.filter(r=>r['Evento']&&r['Data']).map(r=>({name:r['Evento'],event_date:String(r['Data']).slice(0,10),location:r['Local']||'',artists:r['Artistas']||'',image_url:r['Imagem']||'',purchase_url:r['Link de compra']&&r['Link de compra']!=='Tickets com desconto'?r['Link de compra']:'',source_url:r['Endereço']||'',published:true}));const r=await sb.functions.invoke('admin-sync-spreadsheet',{body:{events,config}});if(r.error)throw r.error;$('sheetStatus').textContent=`Sincronização concluída: ${r.data?.importedEvents??events.length} eventos, ${r.data?.configKeys??Object.keys(config).length} configurações.`}catch(e){$('sheetStatus').textContent=e?.message||'Erro na sincronização.'}}}
async function showMetrics(){const r=await sb.from('site_metrics').select('metric_type').order('created_at',{ascending:false}).limit(5000);if(r.error){setMsg(r.error.message,true);return}const d=r.data||[],c=t=>d.filter(x=>x.metric_type===t).length;$('panel').innerHTML=`<h2>Métricas</h2><div class="kpis"><div class="kpi"><b>${c('page_view')}</b><div class="muted">Visitas</div></div><div class="kpi"><b>${c('event_view')}</b><div class="muted">Eventos vistos</div></div><div class="kpi"><b>${c('ticket_click')}</b><div class="muted">Cliques em ingresso</div></div><div class="kpi"><b>${c('favorite_toggle')}</b><div class="muted">Favoritos</div></div></div>`}
function renderTab(){({events:showEvents,gallery:showGallery,sheet:showSheet,metrics:showMetrics})[tab]();document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderTab()});init();
</script></body></html>
