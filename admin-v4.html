<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="cache-control" content="no-cache"><title>BeOn Admin V4</title><style>html,body{margin:0;height:100%;background:#06040b;color:#fff;font-family:Arial,sans-serif}#loading{display:grid;place-items:center;height:100%;text-align:center}.spin{width:34px;height:34px;border:3px solid #ffffff22;border-top-color:#3fe0d0;border-radius:50%;animation:s 1s linear infinite;margin:0 auto 14px}@keyframes s{to{transform:rotate(360deg)}}#err{max-width:760px;margin:40px auto;padding:20px;color:#ff8bad}</style></head><body><div id="loading"><div><div class="spin"></div><div>Carregando BeOn Admin V4…</div></div></div><script>(async()=>{const raw='https://raw.githubusercontent.com/matheusmascena-dotcom/Matheus-be-on-eventos/0b251670479031d17f951eac04c6fee059859c55/admin-v4.html';try{const r=await fetch(raw,{cache:'no-store'});if(!r.ok)throw new Error('Falha ao carregar o painel.');let html=await r.text();const helper=`<script>(()=>{const install=()=>{const input=document.querySelector('#sheet');if(!input||input.dataset.beonLoadButton)return;const originalChange=input.onchange;input.onchange=null;input.dataset.beonLoadButton='1';const wrap=document.createElement('div');wrap.style.cssText='display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px';const btn=document.createElement('button');btn.type='button';btn.className='primary';btn.textContent='Carregar informações no site';const note=document.createElement('span');note.className='muted';note.textContent='Selecione o XLSX e depois clique para sincronizar.';input.parentNode.insertBefore(wrap,input.nextSibling);wrap.append(btn,note);input.addEventListener('change',()=>{note.textContent=input.files&&input.files[0]?\`Arquivo selecionado: \${input.files[0].name}\`:'Nenhum arquivo selecionado'});btn.onclick=()=>{if(!input.files||!input.files.length){input.click();return}note.textContent='Enviando dados para o Supabase...';if(originalChange)originalChange.call(input,{target:input,currentTarget:input})}};const o=new MutationObserver(install);o.observe(document.body,{childList:true,subtree:true});install()})()<\\/script>`;html=html.replace('</body>',helper+'</body>');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div id="err"><h2>Não foi possível abrir o Admin V4</h2><p>'+String(e&&e.message||e)+'</p><p>Atualize a página e tente novamente.</p></div>'}})();</script></body></html>
