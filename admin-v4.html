<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BeOn Admin V4</title><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;background:#06040b;color:#f5f0fa;font:14px/1.5 'Space Grotesk',sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}.box{background:#120d1b;border:1px solid #ffffff18;border-radius:18px;padding:20px;margin-top:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.row{display:flex;gap:8px;flex-wrap:wrap}input,textarea,select{width:100%;box-sizing:border-box;padding:11px;border-radius:10px;border:1px solid #ffffff18;background:#08060d;color:#fff}button{padding:10px 13px;border:1px solid #ffffff18;background:#ffffff08;color:#fff;border-radius:9px;cursor:pointer}.primary{background:#f5f0fa;color:#090711;border:0}.tabs button.active{border-color:#3fe0d0;color:#3fe0d0}.hidden{display:none}.muted{color:#a49ab5;font-size:12px}.cards{display:grid;gap:9px}.item{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:10px;border:1px solid #ffffff12;border-radius:10px}.thumbs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.thumbs img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px}.status{color:#3fe0d0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.kpi{padding:14px;border:1px solid #ffffff12;border-radius:12px}.kpi b{font:32px 'Bebas Neue'}@media(max-width:750px){.grid{grid-template-columns:1fr}.item{grid-template-columns:1fr}.thumbs{grid-template-columns:repeat(3,1fr)}}</style></head><body><main class="wrap"><div class="top"><div><div style="color:#3fe0d0">BE·ON CMS V4</div><h1 style="font:48px 'Bebas Neue';margin:0">Painel administrativo</h1><div id="msg" class="muted">Faça login para gerenciar o site.</div></div><a href="index.html" style="color:#3fe0d0">← Voltar ao site</a></div><section id="login" class="box"><div class="grid"><input id="email" placeholder="E-mail" type="email"><input id="pass" placeholder="Senha" type="password"><button class="primary" id="enter">Entrar</button></div></section><section id="app" class="hidden"><div class="tabs row box"><button data-tab="events" class="active">Eventos</button><button data-tab="gallery">Galerias</button><button data-tab="sheet">Planilha</button><button data-tab="metrics">Métricas</button></div><div id="panel" class="box"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const URL='https://bellpluuhrrluwsgouob.supabase.co',KEY='sb_publishable_oQq38KO1A-4mZttQVL6O-g__RZKKIGX',sb=supabase.createClient(URL,KEY);const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let currentTab='events';
async function loadEvents(){const r=await sb.from('events').select('*').order('event_date');return r.data||[]}
async function showEvents(){const data=await loadEvents();$('panel').innerHTML='<div class="top"><h2>Eventos</h2><button id="new">+ Novo evento</button></div><div id="eventlist" class="cards"></div><div id="form"></div>';const list=$('eventlist');list.innerHTML=data.map(e=>`<div class="item"><div><b>${esc(e.name)}</b><div class="muted">${esc(e.event_date)} · ${esc(e.location)} · ${e.published?'Publicado':'Oculto'}</div></div><button data-edit="${e.id}">Editar</button><button data-pub="${e.id}">${e.published?'Ocultar':'Publicar'}</button><button data-del="${e.id}">Excluir</button></div>`).join('');list.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>form(data.find(e=>e.id===b.dataset.edit)));list.querySelectorAll('[data-pub]').forEach(b=>b.onclick=async()=>{const e=data.find(x=>x.id===b.dataset.pub);await sb.from('events').update({published:!e.published,updated_at:new Date().toISOString()}).eq('id',e.id);showEvents()});list.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('Excluir?')){await sb.from('events').delete().eq('id',b.dataset.del);showEvents()}});$('new').onclick=()=>form({});}
function form(e){$('form').innerHTML=`<div class="box"><div class="grid"><input id="n" placeholder="Nome" value="${esc(e.name)}"><input id="d" type="date" value="${esc(e.event_date)}"><input id="l" placeholder="Local" value="${esc(e.location)}"><input id="a" placeholder="Artistas" value="${esc(e.artists)}"><input id="b" placeholder="Link de compra" value="${esc(e.purchase_url)}"><input id="i" placeholder="URL da capa" value="${esc(e.image_url)}"><input id="m" placeholder="Maps / fonte" value="${esc(e.source_url)}"><textarea id="desc" placeholder="Descrição">${esc(e.description)}</textarea></div><div class="row" style="margin-top:10px"><label><input id="p" type="checkbox" ${e.published===false?'':'checked'}> Publicado</label><button id="save" class="primary">Salvar</button><button id="cancel">Cancelar</button></div></div>`;$('cancel').onclick=showEvents;$('save').onclick=async()=>{const name=$('n').value.trim(),slug=name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');const row={name,event_date:$('d').value,location:$('l').value,artists:$('a').value,purchase_url:$('b').value,image_url:$('i').value,source_url:$('m').value,description:$('desc').value,published:$('p').checked,slug,updated_at:new Date().toISOString()};const r=e.id?await sb.from('events').update(row).eq('id',e.id):await sb.from('events').insert(row);$('msg').textContent=r.error?.message||'Evento salvo.';showEvents();};}
async function showGallery(){const events=await loadEvents();$('panel').innerHTML=`<h2>Galerias</h2><select id="ge">${events.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select><input id="gf" type="file" accept="image/*" multiple style="margin-top:8px"><div class="grid" style="margin-top:8px"><input id="cr" placeholder="Crédito / fotógrafo"><input id="cu" placeholder="Instagram do fotógrafo"><button id="up">Enviar fotos</button></div><div id="photos" class="thumbs" style="margin-top:12px"></div>`;const refresh=async()=>{const id=$('ge').value,r=await sb.from('event_gallery_photos').select('*').eq('event_id',id).order('position');$('photos').innerHTML=(r.data||[]).map(p=>`<div><img src="${esc(p.src_url)}"><button data-x="${p.id}" style="width:100%">Excluir</button></div>`).join('');document.querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{await sb.from('event_gallery_photos').delete().eq('id',b.dataset.x);refresh()})};$('ge').onchange=refresh;$('up').onclick=async()=>{const id=$('ge').value,files=[...$('gf').files];let pos=(await sb.from('event_gallery_photos').select('id',{count:'exact',head:true}).eq('event_id',id)).count||0;for(const f of files){const path=`${id}/${Date.now()}-${f.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const u=await sb.storage.from('event-media').upload(path,f);if(u.error)continue;const url=sb.storage.from('event-media').getPublicUrl(path).data.publicUrl;await sb.from('event_gallery_photos').insert({event_id:id,src_url:url,photo_name:f.name,credit_label:$('cr').value,credit_url:$('cu').value,position:pos++})}refresh()};refresh()}
async function showSheet(){ $('panel').innerHTML=`<h2>Sincronizar planilha</h2><p class="muted">Selecione o arquivo XLSX. A aba Página1 atualiza eventos e a aba Configurações do Site atualiza as configurações do site.</p><input id="sheet" type="file" accept=".xlsx,.xls"><div id="sheetStatus" class="status" style="margin-top:10px"></div>`;$('sheet').onchange=async()=>{const f=$('sheet').files[0];if(!f)return;if(!window.XLSX){await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)})}const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),sn=wb.SheetNames.find(x=>x.toLowerCase().includes('página1'))||wb.SheetNames[0],rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:''}),cn=wb.SheetNames.find(x=>x.toLowerCase().includes('configura')),cr=cn?XLSX.utils.sheet_to_json(wb.Sheets[cn],{defval:''}):[],config={};cr.forEach(r=>{const k=r['Configuração']||r['configuração'],v=r['Valor']||r['valor'];if(k)config[k]=v});const events=rows.filter(r=>r['Evento']&&r['Data']).map(r=>({name:r['Evento'],event_date:String(r['Data']).slice(0,10),location:r['Local']||'',artists:r['Artistas']||'',image_url:r['Imagem']||'',purchase_url:r['Link de compra']&&r['Link de compra']!=='Tickets com desconto'?r['Link de compra']:'',source_url:r['Endereço']||''}));const r=await sb.functions.invoke('admin-sync-spreadsheet',{body:{events,config}});$('sheetStatus').textContent=r.error?.message||`Sincronização concluída: ${r.data?.importedEvents||events.length} eventos.`;}}
async function showMetrics(){const r=await sb.from('site_metrics').select('metric_type,created_at').order('created_at',{ascending:false}).limit(2000),d=r.data||[],v=d.filter(x=>x.metric_type==='page_view').length,e=d.filter(x=>x.metric_type==='event_view').length,c=d.filter(x=>x.metric_type==='ticket_click').length,f=d.filter(x=>x.metric_type==='favorite_toggle').length;$('panel').innerHTML=`<h2>Métricas</h2><div class="grid"><div class="kpi"><b>${v}</b><div class="muted">Visitas</div></div><div class="kpi"><b>${e}</b><div class="muted">Visualizações de eventos</div></div><div class="kpi"><b>${c}</b><div class="muted">Cliques em ingresso</div></div><div class="kpi"><b>${f}</b><div class="muted">Favoritos</div></div></div>`}
function renderTab(){({events:showEvents,gallery:showGallery,sheet:showSheet,metrics:showMetrics})[currentTab]();document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===currentTab))}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{currentTab=b.dataset.tab;renderTab()});$('enter').onclick=async()=>{const r=await sb.auth.signInWithPassword({email:$('email').value,password:$('pass').value});if(r.error){$('msg').textContent=r.error.message;return}$('login').classList.add('hidden');$('app').classList.remove('hidden');$('msg').textContent='Login realizado.';renderTab()};</script></body></html>
