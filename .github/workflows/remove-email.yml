name: Remove footer email
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  remove-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove email
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'\s*<span class="amb-sep">·</span>\s*<span class="amb-label">E-mail:</span><a href="mailto:[^"]+">[^<]+</a>', '', s, flags=re.I)
          p.write_text(s, encoding='utf-8')
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/remove-email.yml
          git commit -m "fix: remove email from footer"
          git push
