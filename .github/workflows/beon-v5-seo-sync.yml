name: BeOn V5 SEO Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/beon-v5-seo-sync.py'
      - '.github/workflows/beon-v5-seo-sync.yml'

permissions:
  contents: write

concurrency:
  group: beon-v5-seo-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sincronizar paginas SEO e sitemap
        env:
          SUPABASE_URL: https://bellpluuhrrluwsgouob.supabase.co
          SUPABASE_KEY: sb_publishable_oQq38KO1A-4mZttQVL6O-g__RZKKIGX
        run: python scripts/beon-v5-seo-sync.py

      - name: Alinhar sitemaps auxiliares
        shell: bash
        run: |
          cp sitemap.xml sitemap-google.xml
          if git diff --quiet -- sitemap.xml; then
            echo 'Sitemap principal sem alteracoes; mantendo lastmod do indice.'
          else
            today=$(date -u +%F)
            cat > sitemap_index.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <sitemapindex xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <sitemap>
              <loc>https://matheusmascena-dotcom.github.io/Matheus-be-on-eventos/sitemap.xml</loc>
              <lastmod>${today}</lastmod>
            </sitemap>
          </sitemapindex>
          EOF
          fi

      - name: Validar arquivos gerados
        run: |
          python -m py_compile scripts/beon-v5-seo-sync.py
          test -s sitemap.xml
          grep -F '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' sitemap.xml
          test -s sitemap-google.xml
          cmp -s sitemap.xml sitemap-google.xml
          test -s sitemap_index.xml
          grep -F '<loc>https://matheusmascena-dotcom.github.io/Matheus-be-on-eventos/sitemap.xml</loc>' sitemap_index.xml
          test -d eventos
          for file in eventos/*.html; do
            grep -F '<!doctype html>' "$file" >/dev/null
            grep -F '<link rel="canonical"' "$file" >/dev/null
          done

      - name: Publicar alteracoes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add eventos sitemap.xml sitemap-google.xml sitemap_index.xml
          if git diff --cached --quiet; then
            echo 'Nenhuma alteracao para publicar.'
          else
            git commit -m 'chore: sincronizar paginas SEO e sitemaps [beon-v5]'
            git push
          fi

# Manual sync trigger marker: no-op change to start a real V5 synchronization run.
