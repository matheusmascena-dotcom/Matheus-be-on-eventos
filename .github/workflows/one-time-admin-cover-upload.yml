name: Apply admin cover upload UI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-admin:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'chore: remove one-time admin cover upload workflow')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Inject cover uploader into Admin V4
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('admin-v4.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="assets/admin-image-upload-v1.js?v=1"></script>'
          if tag not in s:
              marker = '</body>'
              if marker not in s:
                  raise SystemExit('admin-v4.html: </body> not found')
              s = s.replace(marker, tag + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit admin injection
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-v4.html
          git commit -m 'feat: habilitar upload de capa no admin' || echo 'No changes to commit.'
          git push origin HEAD:main
      - name: Remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-time-admin-cover-upload.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/one-time-admin-cover-upload.yml
          git commit -m 'chore: remove one-time admin cover upload workflow'
          git push origin HEAD:main
