name: Apply admin cover upload UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-admin-cover-upload.yml'

permissions:
  contents: write

jobs:
  patch-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Normalize and inject cover uploader
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('admin-v4.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="assets/admin-image-upload-v1.js?v=1"></script>'
          s = s.replace(tag, '')
          marker = '</body>'
          if marker not in s:
              raise SystemExit('admin-v4.html: </body> not found')
          s = s.replace(marker, tag + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit corrected admin
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-v4.html
          git commit -m 'fix: posicionar upload de capa no admin corretamente'
          git push origin HEAD:main
      - name: Remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-time-admin-cover-upload.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/one-time-admin-cover-upload.yml
          git commit -m 'chore: remover workflow temporário de upload de capa'
          git push origin HEAD:main
