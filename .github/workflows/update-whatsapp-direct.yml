name: One-time WhatsApp link update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-whatsapp-direct.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace WhatsApp link
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = 'https://w.app/matheusalves-fale-comigo'
          new = 'https://wa.me/5511942334607'
          count = text.count(old)
          if count == 0:
              raise SystemExit('Old WhatsApp link not found; stopping without changes.')
          p.write_text(text.replace(old, new), encoding='utf-8')
          print(f'Replaced {count} WhatsApp links.')
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/update-whatsapp-direct.yml

      - name: Commit update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/update-whatsapp-direct.yml
          git commit -m 'fix: direcionar WhatsApp do perfil para contato direto'
          git push
