name: BeOn final repair

on:
  push:
    paths:
      - '.github/workflows/beon-final-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[beon-final-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build stable local profile JPG and repair presentation
        shell: python
        run: |
          from pathlib import Path
          import base64
          import re

          root = Path('.')
          index = root / 'index.html'
          s = index.read_text(encoding='utf-8')

          # Extract the embedded JPEG from the existing local profile SVG.
          svg = (root / 'profile-photo.svg').read_text(encoding='utf-8')
          m = re.search(r'data:image/jpeg;base64,([A-Za-z0-9+/=]+)', svg)
          if not m:
              raise SystemExit('profile-photo.svg does not contain an embedded JPEG')
          photo_bytes = base64.b64decode(m.group(1))
          (root/'assets').mkdir(parents=True, exist_ok=True)
          (root/'assets/profile-matheus.jpg').write_bytes(photo_bytes)

          photo = 'assets/profile-matheus.jpg?v=20260820-profile'
          instagram = 'https://www.instagram.com/mat_mascena97/'
          whatsapp = 'https://w.app/matheusalves-fale-comigo'
          intro = ('Descubra os próximos eventos, veja fotos oficiais, salve seus favoritos '
                   'e garanta seu ingresso diretamente da plataforma Ingresse com 5% de '
                   'desconto com meu cupom.')
          full = ('Olá, tudo bem? Me chamo Matheus Mascena e sou um dos embaixadores da Be-On e, '
                  'assim como você, sou apaixonado por música eletrônica e todas as suas vertentes. '
                  'Pensando nisso, criei este espaço para facilitar a vida dos amantes da música '
                  'eletrônica que buscam obter descontos para seus eventos favoritos. Utilize meu '
                  'cupom <strong>MATHEUSMASCENA</strong> e garanta <strong>5% de desconto</strong> na compra do seu ingresso.')

          s = re.sub(r'https://www\\.instagram\\.com/[^"\\']*', instagram, s)
          s = re.sub(r'https://(?:wa\\.me/[^"\\']*|w\\.app/[^"\\']*)', whatsapp, s)
          s = re.sub(r'<p class="hero-sub">.*?</p>', f'<p class="hero-sub">{intro}</p>', s, count=1, flags=re.S)
          s = re.sub(r'<img([^>]+?)src="(?:profile-photo\\.svg|assets/profile-matheus\\.(?:svg|png|jpg)|assets/matheus-profile\\.jpg)[^"]*"([^>]*)>',
                     lambda m: f'<img{m.group(1)}src="{photo}"{m.group(2)}>', s, flags=re.I)
          s = s.replace('src="profile-photo.svg"', f'src="{photo}"')
          s = s.replace('src="assets/profile-matheus.svg"', f'src="{photo}"')

          # Ensure the small local clock is present in the header.
          if 'id="liveClock"' not in s:
              s = s.replace('<div class="header-right">', '<div class="header-right"><div class="live-clock" id="liveClock" aria-live="polite">Agora · --</div>', 1)
          if 'beon-live-clock-script' not in s:
              script = '''<script id="beon-live-clock-script">document.addEventListener("DOMContentLoaded",()=>{const c=document.getElementById("liveClock");if(!c)return;const u=()=>{const n=new Date();c.textContent=n.toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"short"})+" · "+n.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})};u();setInterval(u,1000)});</script>'''
              s = s.replace('</body>', script+'</body>', 1)

          # Remove any previous bottom presentation and rebuild it once.
          s = re.sub(r'<section id="ambassador-bottom-presentation"[\s\S]*?</section>\s*', '', s, count=1)
          block = f'''<section id="ambassador-bottom-presentation" class="ambassador-bottom wrap" aria-label="Apresentação do embaixador">
            <div class="ambassador-bottom-card">
              <div class="ambassador-bottom-photo"><img src="{photo}" alt="Matheus Alves Mascena" width="220" height="320" loading="lazy" decoding="async"></div>
              <div class="ambassador-bottom-copy">
                <span class="eyebrow">CONHEÇA O EMBAIXADOR</span>
                <h2>Matheus Alves Mascena</h2>
                <div class="role">Embaixador Be-On</div>
                <p>{full}</p>
                <div class="amb-links"><a href="{instagram}" target="_blank" rel="noopener">📷 Instagram</a><a href="{whatsapp}" target="_blank" rel="noopener">💬 WhatsApp</a></div>
              </div>
            </div>
          </section>'''
          s = s.replace('</main>\n<footer>', block+'\n</main>\n<footer>', 1)

          if 'beon-bottom-final-css' not in s:
              css='''<style id="beon-bottom-final-css">.ambassador-bottom{padding:6px 22px 36px}.ambassador-bottom-card{display:grid;grid-template-columns:220px 1fr;gap:26px;align-items:center;padding:24px;border:1px solid #7c5cff55;border-radius:24px;background:linear-gradient(135deg,#7c5cff15,#ff2f9208,#3fe0d006),#0d0914dd;box-shadow:0 20px 55px #0008,0 0 45px #7c5cff12;overflow:hidden}.ambassador-bottom-photo img{display:block;width:220px;height:320px;object-fit:cover;border-radius:18px;border:1px solid #3fe0d080;box-shadow:0 0 35px #7c5cff18}.ambassador-bottom-copy h2{font:38px/.95 'Bebas Neue';margin:10px 0 4px;background:linear-gradient(100deg,#fff,#3fe0d0,#8e77ff,#ff2f92);-webkit-background-clip:text;color:transparent}.ambassador-bottom-copy p{font-size:14px;line-height:1.85;color:#c5bccf;margin:0}.ambassador-bottom-copy strong{color:#3fe0d0}@media(max-width:700px){.ambassador-bottom-card{grid-template-columns:1fr;text-align:center}.ambassador-bottom-photo img{margin:auto;width:min(220px,70vw);height:auto;aspect-ratio:3/4}.ambassador-bottom-copy .amb-links{justify-content:center}}</style>'''
              s=s.replace('</head>',css+'</head>',1)

          index.write_text(s,encoding='utf-8')

          # Remove legacy/competing workflows; gallery sync stays intact.
          for rel in [
              '.github/workflows/beon-finalize-presentation.yml',
              '.github/workflows/restore-profile-presentation.yml',
              '.github/workflows/finalize-profile-presentation.yml',
              '.github/workflows/site-enhancements.yml',
              '.github/workflows/profile-presentation.yml',
          ]:
              p=Path(rel)
              if p.exists(): p.unlink()

      - name: Commit and cleanly publish
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/profile-matheus.jpg
          git add -u .github/workflows
          git commit -m 'fix: publish final BeOn presentation photo and layout [beon-final-repair]'
          git push
