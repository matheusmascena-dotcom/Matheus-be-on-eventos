name: BeOn Master Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'profile-config.json'
      - '.github/workflows/beon-master-sync.yml'

permissions:
  contents: write

concurrency:
  group: beon-profile-sync
  cancel-in-progress: true

jobs:
  profile:
    if: ${{ !contains(github.event.head_commit.message, '[beon-profile-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Aplicar perfil e centralizar apresentação
        shell: python
        run: |
          import json
          import re
          from pathlib import Path

          root = Path('.')
          cfg = json.loads((root / 'profile-config.json').read_text(encoding='utf-8'))
          image_url = cfg['profileImage']
          p = root / 'index.html'
          html = p.read_text(encoding='utf-8')

          html = re.sub(r'<style id="beon-no-profile-photo">.*?</style>\s*', '', html, flags=re.S)
          html = re.sub(r'<style id="beon-profile-layout-final">.*?</style>\s*', '', html, flags=re.S)

          if 'class="amb-photo"' not in html:
              html, n = re.subn(
                  r'(<div class="hero-inner">)\s*(<div class="amb-copy">)',
                  r'\1\n<div class="amb-photo"><img src="' + image_url + r'" alt="Matheus Alves Mascena" loading="eager" fetchpriority="high" decoding="async"></div>\n\2',
                  html, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit('Estrutura hero-inner não encontrada.')
          else:
              html = re.sub(
                  r'(<div class="amb-photo"><img[^>]*src=")[^"]*("[^>]*>\s*</div>)',
                  r'\1' + image_url + r'\2', html, count=1, flags=re.S)

          if 'class="ambassador-bottom-card"' in html:
              if 'class="ambassador-bottom-photo"' not in html:
                  html, n = re.subn(
                      r'(<div class="ambassador-bottom-card">)\s*(<div class="ambassador-bottom-copy">)',
                      r'\1\n<div class="ambassador-bottom-photo"><img src="' + image_url + r'" alt="Matheus Alves Mascena" loading="lazy" decoding="async"></div>\n\2',
                      html, count=1, flags=re.S)
                  if n != 1:
                      raise SystemExit('Apresentação inferior não encontrada.')
              else:
                  html = re.sub(
                      r'(<div class="ambassador-bottom-photo"><img[^>]*src=")[^"]*("[^>]*>\s*</div>)',
                      r'\1' + image_url + r'\2', html, count=1, flags=re.S)

          style = '''\n<style id="beon-profile-layout-final">\n.hero-inner{grid-template-columns:1fr!important;justify-items:center!important;text-align:center!important;gap:20px!important}\n.amb-photo{width:min(220px,42vw)!important;margin:0 auto!important}\n.amb-photo img{display:block!important;width:100%!important;height:auto!important;aspect-ratio:3/4!important;object-fit:cover!important;border-radius:22px!important}\n.amb-copy{width:100%!important;max-width:900px!important;display:flex!important;flex-direction:column!important;align-items:center!important}\n.ambassador-bottom-card{grid-template-columns:1fr!important;text-align:center!important;justify-items:center!important}\n.ambassador-bottom-photo img{display:block!important;margin:0 auto!important;width:min(220px,42vw)!important;height:auto!important;aspect-ratio:3/4!important;object-fit:cover!important}\n.ambassador-bottom-copy{width:100%!important;max-width:900px!important}\n@media(max-width:700px){.amb-photo,.ambassador-bottom-photo img{width:min(210px,68vw)!important}}\n</style>\n'''
          html = re.sub(r'</head>', style + '</head>', html, count=1, flags=re.I)
          p.write_text(html, encoding='utf-8')
          print(image_url)

      - name: Validar
        run: |
          grep -F 'drive.google.com/thumbnail?id=1vrISCF_6pWFQAlOg6PabIOP9k3X6R4nM' index.html
          grep -F 'beon-profile-layout-final' index.html
          grep -F 'amb-photo' index.html

      - name: Publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html profile-config.json .github/workflows/beon-master-sync.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'sync: aplicar foto de perfil e centralizar apresentação [beon-profile-sync]'
          git push
