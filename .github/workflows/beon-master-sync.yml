name: BeOn Master Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'profile-config.json'
      - '.github/workflows/beon-master-sync.yml'
      - 'index.html'

permissions:
  contents: write

concurrency:
  group: beon-profile-sync
  cancel-in-progress: true

jobs:
  profile:
    if: ${{ !contains(github.event.head_commit.message, '[beon-profile-layout]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reposicionar a foto existente sem alterar o arquivo
        shell: python
        run: |
          import json
          import re
          from pathlib import Path

          root = Path('.')
          cfg = json.loads((root / 'profile-config.json').read_text(encoding='utf-8'))
          image_url = cfg['profileImage']
          p = root / 'index.html'
          html = p.read_text(encoding='utf-8')

          # Remover somente a imagem do bloco superior.
          html = re.sub(
              r'<div\s+class=["\']amb-photo["\'][^>]*>.*?</div>\s*',
              '', html, count=1, flags=re.I | re.S
          )

          # O topo continua com as mesmas informações, centralizadas e sem foto.
          top_style = '''\n<style id="beon-profile-top-no-photo">\n.hero-inner{grid-template-columns:1fr!important;justify-items:center!important;text-align:center!important;gap:20px!important}\n.amb-copy{width:100%!important;max-width:900px!important;display:flex!important;flex-direction:column!important;align-items:center!important}\n</style>\n'''
          html = re.sub(r'<style\s+id=["\']beon-profile-top-no-photo["\']>.*?</style>\s*', '', html, flags=re.I | re.S)
          html = re.sub(r'</head>', top_style + '</head>', html, count=1, flags=re.I)

          # Na apresentação inferior, manter a mesma foto existente ao lado do texto.
          if 'class="ambassador-bottom-card"' in html:
              if 'class="ambassador-bottom-photo"' not in html:
                  html, inserted = re.subn(
                      r'(<div\s+class=["\']ambassador-bottom-card["\'][^>]*>\s*)(<div\s+class=["\']ambassador-bottom-copy["\'])',
                      r'\1<div class="ambassador-bottom-photo"><img src="' + image_url + r'" alt="Matheus Alves Mascena" loading="lazy" decoding="async"></div>\n\2',
                      html, count=1, flags=re.I | re.S
                  )
                  if inserted != 1:
                      raise SystemExit('Não foi possível localizar a apresentação inferior.')
              else:
                  html = re.sub(
                      r'(<div\s+class=["\']ambassador-bottom-photo["\'][^>]*>\s*<img[^>]*src=["\'])[^"\']*("[^>]*>\s*</div>)',
                      r'\1' + image_url + r'\2', html, count=1, flags=re.I | re.S
                  )

          bottom_style = '''\n<style id="beon-profile-bottom-side-by-side">\n.ambassador-bottom-card{grid-template-columns:240px minmax(0,1fr)!important;gap:28px!important;align-items:center!important;text-align:left!important}\n.ambassador-bottom-photo{display:flex!important;justify-content:center!important;align-items:center!important}\n.ambassador-bottom-photo img{display:block!important;width:220px!important;height:300px!important;object-fit:cover!important;border-radius:18px!important;border:1px solid #3fe0d088!important;box-shadow:0 0 0 1px #7c5cff22,0 0 38px #7c5cff18!important}\n.ambassador-bottom-copy{width:100%!important;max-width:none!important}\n@media(max-width:700px){.ambassador-bottom-card{grid-template-columns:1fr!important;text-align:center!important}.ambassador-bottom-photo img{width:min(220px,70vw)!important;height:auto!important;aspect-ratio:3/4!important}.ambassador-bottom-copy{max-width:900px!important;margin:auto!important}}\n</style>\n'''
          html = re.sub(r'<style\s+id=["\']beon-profile-bottom-side-by-side["\']>.*?</style>\s*', '', html, flags=re.I | re.S)
          html = re.sub(r'</head>', bottom_style + '</head>', html, count=1, flags=re.I)

          p.write_text(html, encoding='utf-8')
          print('Foto reposicionada: topo sem imagem; apresentação inferior com a mesma imagem ao lado do texto.')

      - name: Validar
        run: |
          grep -F 'beon-profile-top-no-photo' index.html
          grep -F 'beon-profile-bottom-side-by-side' index.html
          grep -F 'ambassador-bottom-photo' index.html
          grep -F 'drive.google.com/thumbnail?id=1vrISCF_6pWFQAlOg6PabIOP9k3X6R4nM' index.html
          ! grep -F '<div class="amb-photo">' index.html

      - name: Publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/beon-master-sync.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: deixar foto somente na apresentação inferior [beon-profile-layout]'
          git push
