name: BeOn Master Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/Eventos - Be On _ 2026(5)_V3_Final.xlsx'
      - '.github/workflows/beon-master-sync.yml'

permissions:
  contents: write

concurrency:
  group: beon-master-sync
  cancel-in-progress: true

jobs:
  remove-profile-image:
    if: ${{ !contains(github.event.head_commit.message, '[beon-profile-removal]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Remover somente as fotos da apresentação
        shell: python
        run: |
          import re
          from pathlib import Path

          css = '''\n<style id="beon-no-profile-photo">\n.amb-photo,.ambassador-bottom-photo{display:none!important}\n.hero-inner{grid-template-columns:1fr!important}\n.ambassador-bottom-card{grid-template-columns:1fr!important}\n</style>\n'''

          for filename in ("index.html", "event.html"):
              p = Path(filename)
              if not p.exists():
                  continue
              html = p.read_text(encoding="utf-8")

              # Remove the known profile-photo containers entirely.
              html = re.sub(r'<div\s+class=["\']amb-photo["\'][^>]*>.*?</div>', '', html, flags=re.I|re.S)
              html = re.sub(r'<div\s+class=["\']ambassador-bottom-photo["\'][^>]*>.*?</div>', '', html, flags=re.I|re.S)

              # Remove any remaining profile image element, regardless of its old source.
              html = re.sub(r'<img\b(?=[^>]*(?:profile-matheus|profile-photo|matheus-profile|drive\.google\.com/thumbnail))[^>]*>', '', html, flags=re.I|re.S)

              # Keep the layout single-column so no empty photo column remains.
              html = re.sub(r'<style\s+id=["\']beon-no-profile-photo["\']>.*?</style>', '', html, flags=re.I|re.S)
              html = html.replace('</head>', css + '</head>', 1)
              p.write_text(html, encoding='utf-8')

          # Remove the old profile image asset so it cannot be used again.
          old_asset = Path('assets/profile-matheus-uploaded.svg')
          if old_asset.exists():
              old_asset.unlink()

      - name: Validar que não existe mais foto de apresentação
        shell: bash
        run: |
          ! grep -RniE 'profile-matheus|profile-photo|matheus-profile|drive.google.com/thumbnail' index.html event.html || true
          test ! -e assets/profile-matheus-uploaded.svg

      - name: Publicar uma única vez
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html event.html assets/profile-matheus-uploaded.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: remover fotos da apresentação [beon-profile-removal]'
          git push
