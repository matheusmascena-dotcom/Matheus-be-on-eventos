name: BeOn Master Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/Eventos - Be On _ 2026(5)_V3_Final.xlsx'
      - '.github/workflows/beon-master-sync.yml'

permissions:
  contents: write

concurrency:
  group: beon-master-sync
  cancel-in-progress: true

jobs:
  sync-profile:
    if: ${{ !contains(github.event.head_commit.message, '[beon-profile-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependências
        run: python -m pip install --upgrade pip openpyxl

      - name: Ler foto da planilha e atualizar somente a apresentação
        shell: python
        run: |
          import json, re
          from pathlib import Path
          from openpyxl import load_workbook

          root = Path('.')
          book = root / 'data' / 'Eventos - Be On _ 2026(5)_V3_Final.xlsx'
          wb = load_workbook(book, data_only=True)
          ws = wb['Configurações do Site']

          cfg = {}
          for row in ws.iter_rows(min_row=2, values_only=True):
              if row and row[0]:
                  cfg[str(row[0]).strip()] = row[1]

          source = str(cfg.get('Foto Perfil') or '').strip()
          match = re.search(r'/file/d/([A-Za-z0-9_-]+)', source) or re.search(r'[?&]id=([A-Za-z0-9_-]+)', source)
          if not match:
              raise RuntimeError('Não encontrei um ID válido no campo Foto Perfil da aba Configurações do Site.')

          file_id = match.group(1)
          # O navegador carrega a própria foto do Drive; não há download, SVG ou Instagram envolvidos.
          image_url = f'https://drive.google.com/thumbnail?id={file_id}&sz=w1200'

          site_config = {
              'profile_source': source,
              'profile_image_url': image_url,
              'profile_drive_id': file_id
          }
          (root / 'site-config.json').write_text(json.dumps(site_config, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Alteração cirúrgica: somente <img> cujo alt seja a apresentação do Matheus.
          p = root / 'index.html'
          html = p.read_text(encoding='utf-8')
          pattern = re.compile(r'(<img\b(?=[^>]*\balt=["\']Matheus Alves Mascena["\'])[^>]*\bsrc=["\'])[^"\']*(["\'])', re.I | re.S)
          html2, count = pattern.subn(r'\g<1>' + image_url + r'\g<2>', html)
          if count == 0:
              # Fallback para as referências antigas conhecidas, sem tocar em cards ou galerias.
              old = re.compile(r'assets/(?:profile-matheus-uploaded|profile-photo|profile-matheus|matheus-profile)[^"\']*\.(?:svg|png|jpe?g)(?:\?[^"\']*)?', re.I)
              html2, count = old.subn(image_url, html)

          if count == 0:
              raise RuntimeError('Nenhuma referência da foto de apresentação foi encontrada no index.html.')

          p.write_text(html2, encoding='utf-8')
          print(f'Foto de perfil sincronizada a partir da planilha: {image_url} | referências atualizadas: {count}')

      - name: Validar somente a mudança de perfil
        run: |
          test -s site-config.json
          grep -F 'drive.google.com/thumbnail?id=' index.html
          grep -F 'profile_source' site-config.json
          test -f assets/galleries/adriatique-x-sao-paulo.json
          test -f assets/galleries/crochestra-brasil.json || true

      - name: Publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html site-config.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'sync: foto de perfil pela planilha [beon-profile-sync]'
          git push
