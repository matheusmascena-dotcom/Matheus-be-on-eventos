name: BeOn Master Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/beon-master-sync.yml'
      - 'assets/background-v2.css'

permissions:
  contents: write

concurrency:
  group: beon-master-sync
  cancel-in-progress: true

jobs:
  visual:
    if: ${{ !contains(github.event.head_commit.message, '[beon-background]') && !contains(github.event.head_commit.message, '[beon-upcoming]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restaurar a versão estável 3.0 antes da melhoria visual
        shell: bash
        run: |
          git fetch origin b8c4d5a83ffa7a27b3c3fbaac50fef6ca9f0077f --depth=1
          git checkout b8c4d5a83ffa7a27b3c3fbaac50fef6ca9f0077f -- index.html

      - name: Aplicar melhorias de background 4 6 7 8
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          html=p.read_text(encoding='utf-8')
          css='''
<style id="beon-background-upgrade-1">
body{background:radial-gradient(900px 520px at 8% 4%,rgba(124,92,255,.20),transparent 68%),radial-gradient(760px 460px at 92% 8%,rgba(255,47,146,.14),transparent 68%),radial-gradient(820px 520px at 52% 42%,rgba(63,224,208,.07),transparent 70%),radial-gradient(900px 700px at 18% 88%,rgba(124,92,255,.09),transparent 72%),linear-gradient(145deg,#04030a 0%,#080510 48%,#06030d 100%)!important}
body:before{content:"";position:fixed;inset:-18%;pointer-events:none;z-index:-3;background:radial-gradient(520px 340px at 20% 18%,rgba(124,92,255,.14),transparent 70%),radial-gradient(460px 300px at 78% 28%,rgba(255,47,146,.10),transparent 72%),radial-gradient(500px 360px at 58% 78%,rgba(63,224,208,.06),transparent 72%);filter:blur(42px);opacity:.95;animation:beonAurora 18s ease-in-out infinite alternate}
body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:-2;background-image:radial-gradient(rgba(255,255,255,.022) .7px,transparent .7px);background-size:13px 13px;opacity:.42}
@keyframes beonAurora{0%{transform:translate3d(-1.5%,-1%,0) scale(1)}50%{transform:translate3d(1.2%,.8%,0) scale(1.025)}100%{transform:translate3d(-.4%,1.4%,0) scale(1.045)}}
main{position:relative;isolation:isolate}
main:before{content:"";position:fixed;left:-8vw;right:-8vw;top:20%;height:160px;pointer-events:none;z-index:-1;opacity:.28;background:repeating-linear-gradient(90deg,transparent 0 15px,rgba(63,224,208,.30) 16px 17px,transparent 18px 29px),linear-gradient(90deg,transparent,rgba(124,92,255,.75),rgba(255,47,146,.60),rgba(63,224,208,.70),transparent);filter:blur(9px);transform:skewY(-5deg) scale(1.03);animation:beonWave 17s ease-in-out infinite alternate}
main:after{content:"";position:fixed;left:-10vw;right:-10vw;bottom:8%;height:110px;pointer-events:none;z-index:-1;opacity:.16;background:repeating-linear-gradient(90deg,transparent 0 9px,rgba(255,255,255,.18) 10px 11px,transparent 12px 25px),linear-gradient(90deg,transparent,rgba(124,92,255,.60),rgba(255,47,146,.46),rgba(63,224,208,.55),transparent);filter:blur(6px);transform:rotate(-2deg);animation:beonPulse 10s ease-in-out infinite alternate}
@keyframes beonWave{0%{transform:translate3d(-3%,0,0) skewY(-6deg) scale(1.02)}50%{transform:translate3d(1%,2%,0) skewY(-3deg) scale(1.06)}100%{transform:translate3d(3%,-1%,0) skewY(-7deg) scale(1.04)}}
@keyframes beonPulse{0%{opacity:.08;transform:translateX(-1%) rotate(-2deg)}100%{opacity:.24;transform:translateX(2%) rotate(-1deg)}}
.hero-inner,.card,.ambassador-bottom-card,.event-search,.mobile-nav{box-shadow:0 18px 60px rgba(0,0,0,.58),0 0 40px rgba(124,92,255,.09)}
.hero-inner{border-color:rgba(124,92,255,.34)}
.card,.ambassador-bottom-card{border-color:rgba(124,92,255,.28)}
.card:hover{box-shadow:0 28px 74px rgba(0,0,0,.74),0 0 48px rgba(124,92,255,.15),0 0 24px rgba(63,224,208,.07)}
.coupon-card{box-shadow:0 0 30px rgba(255,47,146,.10),0 12px 34px rgba(0,0,0,.28)}
.search-wrap:before{filter:drop-shadow(0 0 6px rgba(63,224,208,.35))}
.tag{box-shadow:inset 0 0 0 1px rgba(63,224,208,.04),0 0 12px rgba(63,224,208,.06)}
.off{box-shadow:0 0 14px rgba(255,47,146,.14)}
.ambassador-bottom-card{background:linear-gradient(135deg,rgba(25,15,38,.94),rgba(10,7,17,.96),rgba(19,12,29,.94))!important}
@media(max-width:820px){main:before{height:120px;opacity:.20;filter:blur(12px)}main:after{height:80px;opacity:.10;filter:blur(8px)}.beon-bg-music{opacity:.64}.hero-inner,.card,.ambassador-bottom-card{box-shadow:0 16px 44px rgba(0,0,0,.54),0 0 28px rgba(124,92,255,.06)}}
@media(max-width:520px){main:before{top:18%;height:100px;opacity:.14}main:after{bottom:12%;height:68px;opacity:.07}body:before{animation:none}body:after{animation:none}.hero-inner{box-shadow:0 14px 36px rgba(0,0,0,.50),0 0 22px rgba(124,92,255,.05)}}
@media(prefers-reduced-motion:reduce){main:before,main:after,body:before{animation:none!important}}
</style>
'''
          html=re.sub(r'<style id="beon-background-upgrade-1">.*?</style>\s*','',html,flags=re.S)
          html=re.sub(r'</head>',css+'</head>',html,count=1,flags=re.I)
          p.write_text(html,encoding='utf-8')

      - name: Adicionar evento mais próximo com contador regressivo
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          html=p.read_text(encoding='utf-8')

          styles='''
<style id="beon-upcoming-featured">
.featured-upcoming{padding:12px 22px 26px}.featured-card{position:relative;display:grid;grid-template-columns:minmax(240px,360px) 1fr;gap:28px;align-items:center;padding:18px;border:1px solid rgba(255,47,146,.42);border-radius:26px;overflow:hidden;background:linear-gradient(135deg,rgba(35,15,30,.96),rgba(14,8,19,.97) 55%,rgba(20,10,28,.96));box-shadow:0 24px 70px rgba(0,0,0,.65),0 0 42px rgba(255,47,146,.09),inset 0 1px rgba(255,255,255,.04)}.featured-card:before{content:"";position:absolute;inset:-30%;background:radial-gradient(circle at 22% 20%,rgba(255,47,146,.14),transparent 35%),radial-gradient(circle at 82% 75%,rgba(124,92,255,.12),transparent 38%);filter:blur(28px);pointer-events:none}.featured-media,.featured-copy{position:relative;z-index:1}.featured-media{min-height:320px;display:grid;place-items:center;border-radius:20px;overflow:hidden;background:rgba(0,0,0,.36);border:1px solid rgba(255,255,255,.08)}.featured-media img{display:block;width:100%;height:320px;object-fit:contain;background:#030207}.featured-badge{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border-radius:999px;border:1px solid rgba(255,47,146,.38);background:rgba(255,47,146,.10);color:#ff8ab9;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.featured-copy h2{font:52px/.95 'Bebas Neue';margin:12px 0 8px;text-transform:uppercase;background:linear-gradient(100deg,#fff,#ff79ab,#8e77ff,#3fe0d0);-webkit-background-clip:text;background-clip:text;color:transparent}.featured-meta{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 18px}.featured-chip{padding:7px 10px;border:1px solid rgba(255,255,255,.10);border-radius:999px;background:rgba(255,255,255,.03);color:#c9c1d0;font-size:11px}.featured-countdown{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:10px 0 18px}.featured-unit{padding:12px 8px;border:1px solid rgba(255,47,146,.22);border-radius:14px;background:rgba(3,2,6,.78);text-align:center}.featured-unit strong{display:block;font:38px/1 'Bebas Neue';color:#ff3f86;text-shadow:0 0 18px rgba(255,47,146,.16)}.featured-unit span{display:block;margin-top:5px;color:#a99faf;font-size:9px;letter-spacing:.14em;text-transform:uppercase}.featured-actions{display:flex;gap:9px;flex-wrap:wrap}.featured-action{display:inline-flex;justify-content:center;align-items:center;padding:11px 15px;border-radius:11px;font-size:11px;font-weight:800}.featured-buy{background:#f8f4fb;color:#0a0710}.featured-event{border:1px solid rgba(63,224,208,.28);color:#3fe0d0;background:rgba(63,224,208,.06)}
@media(max-width:700px){.featured-upcoming{padding:8px 22px 20px}.featured-card{grid-template-columns:1fr;gap:16px;padding:14px;border-radius:22px}.featured-media{min-height:0}.featured-media img{height:320px}.featured-copy h2{font-size:44px}.featured-countdown{gap:7px}.featured-unit{padding:10px 5px}.featured-unit strong{font-size:31px}.featured-actions{display:grid;grid-template-columns:1fr 1fr}.featured-action{width:100%}}
@media(prefers-reduced-motion:reduce){.featured-card:before{display:none}}
</style>
'''
          html=re.sub(r'<style id="beon-upcoming-featured">.*?</style>\s*','',html,flags=re.S)
          html=re.sub(r'</head>',styles+'</head>',html,count=1,flags=re.I)

          section='''
<section id="featured-upcoming" class="featured-upcoming wrap" aria-label="Próximo evento em destaque"><div id="featuredUpcoming"></div></section>
'''
          html=re.sub(r'\s*<section class="section wrap" id="eventos">', section+'<section class="section wrap" id="eventos">', html, count=1, flags=re.I)

          script='''
<script id="beon-upcoming-featured-script">
(function(){
  const host=document.getElementById('featuredUpcoming');
  if(!host || !Array.isArray(window.EVENTS) && typeof EVENTS==='undefined') return;
  const events=typeof EVENTS!=='undefined'?EVENTS:window.EVENTS;
  const now=Date.now();
  const upcoming=events.filter(e=>new Date(e[2]+'T00:00:00').getTime()>=now).sort((a,b)=>new Date(a[2]+'T00:00:00')-new Date(b[2]+'T00:00:00'))[0];
  if(!upcoming){document.getElementById('featured-upcoming').style.display='none';return;}
  const [slug,name,date,location,artists,image,buy]=upcoming;
  const eventTs=new Date(date+'T00:00:00').getTime();
  const formatDate=new Date(date+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});
  host.innerHTML=`<div class="featured-card"><div class="featured-media"><img src="${image}" alt="${name}" loading="eager" fetchpriority="high" decoding="async"></div><div class="featured-copy"><span class="featured-badge">✦ Próximo evento</span><h2>${name}</h2><div class="featured-meta"><span class="featured-chip">📅 ${formatDate}</span><span class="featured-chip">📍 ${location}</span><span class="featured-chip">🎧 ${artists}</span></div><div class="featured-countdown" aria-live="polite"><div class="featured-unit"><strong id="fcDays">--</strong><span>Dias</span></div><div class="featured-unit"><strong id="fcHours">--</strong><span>Horas</span></div><div class="featured-unit"><strong id="fcMinutes">--</strong><span>Min</span></div><div class="featured-unit"><strong id="fcSeconds">--</strong><span>Seg</span></div></div><div class="featured-actions"><a class="featured-action featured-buy" href="${buy}" target="_blank" rel="noopener">Garantir meu ingresso</a><a class="featured-action featured-event" href="event.html?event=${slug}">Ver evento ↗</a></div></div></div>`;
  function tick(){const left=Math.max(0,eventTs-Date.now());const days=Math.floor(left/86400000);const hours=Math.floor(left/3600000)%24;const mins=Math.floor(left/60000)%60;const secs=Math.floor(left/1000)%60;document.getElementById('fcDays').textContent=String(days).padStart(2,'0');document.getElementById('fcHours').textContent=String(hours).padStart(2,'0');document.getElementById('fcMinutes').textContent=String(mins).padStart(2,'0');document.getElementById('fcSeconds').textContent=String(secs).padStart(2,'0');}
  tick(); setInterval(tick,1000);
})();
</script>
'''
          html=re.sub(r'\s*<script id="beon-upcoming-featured-script">.*?</script>\s*','',html,flags=re.S)
          html=re.sub(r'</body>',script+'</body>',html,count=1,flags=re.I)
          p.write_text(html,encoding='utf-8')

      - name: Validar
        run: |
          grep -F 'beon-background-upgrade-1' index.html
          grep -F 'beonAurora' index.html
          grep -F 'beon-upcoming-featured' index.html
          grep -F 'featuredUpcoming' index.html
          grep -F 'fcDays' index.html
          ! grep -F 'beon-upcoming-featured' <(git show b8c4d5a83ffa7a27b3c3fbaac50fef6ca9f0077f:index.html)

      - name: Publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'feat: destacar proximo evento com countdown [beon-upcoming]'
          git push
