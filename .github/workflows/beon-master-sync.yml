name: BeOn Master Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/beon-master-sync.yml'

permissions:
  contents: write

concurrency:
  group: beon-master-sync
  cancel-in-progress: true

jobs:
  visual:
    if: ${{ !contains(github.event.head_commit.message, '[beon-background]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restaurar a versão estável 3.0 antes da melhoria visual
        shell: bash
        run: |
          git fetch origin b8c4d5a83ffa7a27b3c3fbaac50fef6ca9f0077f --depth=1
          git checkout b8c4d5a83ffa7a27b3c3fbaac50fef6ca9f0077f -- index.html

      - name: Aplicar melhorias de background
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          html=p.read_text(encoding='utf-8')
          css='''\n<style id="beon-background-upgrade-1">\nbody{background:radial-gradient(900px 520px at 8% 4%,rgba(124,92,255,.18),transparent 68%),radial-gradient(760px 460px at 92% 8%,rgba(255,47,146,.12),transparent 68%),radial-gradient(820px 520px at 52% 42%,rgba(63,224,208,.055),transparent 70%),radial-gradient(900px 700px at 18% 88%,rgba(124,92,255,.08),transparent 72%),linear-gradient(145deg,#04030a 0%,#080510 48%,#06030d 100%)!important}\nbody:before{content:"";position:fixed;inset:-18%;pointer-events:none;z-index:-3;background:radial-gradient(520px 340px at 20% 18%,rgba(124,92,255,.12),transparent 70%),radial-gradient(460px 300px at 78% 28%,rgba(255,47,146,.08),transparent 72%),radial-gradient(500px 360px at 58% 78%,rgba(63,224,208,.045),transparent 72%);filter:blur(42px);opacity:.95;animation:beonAurora 18s ease-in-out infinite alternate}\nbody:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:-2;background-image:radial-gradient(rgba(255,255,255,.022) .7px,transparent .7px);background-size:13px 13px;opacity:.42}\n@keyframes beonAurora{0%{transform:translate3d(-1.5%,-1%,0) scale(1)}50%{transform:translate3d(1.2%,.8%,0) scale(1.025)}100%{transform:translate3d(-.4%,1.4%,0) scale(1.045)}}\n.hero:before{content:"";position:absolute;inset:0 -18vw;height:520px;pointer-events:none;background:radial-gradient(600px 240px at 50% 15%,rgba(124,92,255,.10),transparent 72%);filter:blur(10px);z-index:-1}\n.section{position:relative}.section:before{content:"";position:absolute;left:50%;top:0;width:760px;height:260px;transform:translateX(-50%);pointer-events:none;background:radial-gradient(circle,rgba(124,92,255,.055),transparent 70%);filter:blur(18px);z-index:-1}\n.card{background:linear-gradient(155deg,rgba(25,17,36,.92),rgba(10,7,17,.94))!important;border-color:rgba(255,255,255,.10)!important;box-shadow:0 16px 42px rgba(0,0,0,.55),0 0 34px rgba(124,92,255,.06)!important}\n.ambassador-bottom-card{background:linear-gradient(135deg,rgba(25,15,38,.92),rgba(10,7,17,.94),rgba(19,12,29,.92))!important;box-shadow:0 24px 60px rgba(0,0,0,.62),0 0 46px rgba(124,92,255,.08)!important}\n</style>\n'''
          html=re.sub(r'<style id="beon-background-upgrade-1">.*?</style>\s*','',html,flags=re.S)
          html=re.sub(r'</head>',css+'</head>',html,count=1,flags=re.I)
          p.write_text(html,encoding='utf-8')
      - name: Validar
        run: |
          grep -F 'beon-background-upgrade-1' index.html
          grep -F 'beonAurora' index.html
          ! grep -F 'beon-background-upgrade-1' <(git show b8c4d5a83ffa7a27b3c3fbaac50fef6ca9f0077f:index.html)
      - name: Publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'feat: melhorar background visual [beon-background]'
          git push
