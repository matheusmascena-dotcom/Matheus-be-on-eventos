name: Add contact search and countdown
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  enhance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* Contact, search and countdown enhancement */'
          if marker not in s:
              css='''\n/* Contact, search and countdown enhancement */\n.contact-btn{display:inline-flex;padding:9px 12px;border:1px solid rgba(63,224,208,.28);border-radius:9px;background:linear-gradient(90deg,rgba(63,224,208,.08),rgba(124,92,255,.10));font-size:10.5px;font-weight:700;color:var(--cyan);transition:.15s}\n.contact-btn:hover{border-color:var(--cyan);color:var(--ink);box-shadow:0 0 18px rgba(63,224,208,.16);transform:translateY(-1px)}\n.event-search{max-width:760px;margin:0 auto 22px;position:relative}\n.event-search input{width:100%;padding:14px 17px 14px 44px;border:1px solid rgba(124,92,255,.28);border-radius:14px;background:rgba(8,6,13,.68);color:var(--ink);font:500 12px 'Space Grotesk',sans-serif;outline:none;backdrop-filter:blur(8px)}\n.event-search input::placeholder{color:var(--muted)}\n.event-search input:focus{border-color:rgba(63,224,208,.55);box-shadow:0 0 24px rgba(63,224,208,.10)}\n.event-search:before{content:'⌕';position:absolute;left:16px;top:50%;transform:translateY(-52%);color:var(--cyan);font-size:19px;z-index:2}\n.search-empty{display:none;text-align:center;color:var(--muted);font-size:11.5px;padding:20px;border:1px dashed var(--line);border-radius:12px;margin-top:12px}\n.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px;max-width:330px}\n.countdown-box{border:1px solid rgba(63,224,208,.16);background:rgba(8,6,13,.45);border-radius:9px;padding:7px 5px;text-align:center}\n.countdown-num{display:block;font-family:'Bebas Neue',sans-serif;font-size:23px;line-height:1;color:var(--cyan)}\n.countdown-label{display:block;font-size:7px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-top:2px}\n@media(max-width:560px){.countdown{max-width:none}.event-search{margin-bottom:18px}}\n'''
              s=s.replace('</style>',css+'</style>',1)
              contact=' <a class="contact-btn" href="https://w.app/matheusalves-fale-comigo" target="_blank" rel="noopener">💬 Fale comigo</a>'
              if 'w.app/matheusalves-fale-comigo' not in s:
                  s=s.replace('</div></div></section>', '</div>'+contact+'</div></div></section>', 1) if '</div></div></section>' in s else s
              search='''<div class="event-search"><input id="eventSearch" type="search" placeholder="Pesquisar evento por nome ou data..." aria-label="Pesquisar evento por nome ou data"></div><div id="searchEmpty" class="search-empty">Nenhum evento encontrado. Tente outro nome ou data.</div>'''
              if 'id="eventSearch"' not in s:
                  s=s.replace('<div class="events-grid">',search+'<div class="events-grid">',1)
              js='''\n<script>\n(function(){\n  // Contact button: add it to the ambassador social links when the section exists.\n  const social=document.querySelector('.social-row');\n  if(social && !social.querySelector('.contact-btn')){\n    const a=document.createElement('a'); a.className='social-btn contact-btn'; a.href='https://w.app/matheusalves-fale-comigo'; a.target='_blank'; a.rel='noopener'; a.textContent='💬 Fale comigo'; social.appendChild(a);\n  }\n  // Search by event name or date.\n  const input=document.getElementById('eventSearch'); const grid=document.querySelector('.events-grid'); const empty=document.getElementById('searchEmpty');\n  if(input && grid){\n    const cards=[...grid.querySelectorAll('.card')];\n    input.addEventListener('input',()=>{\n      const q=input.value.trim().toLocaleLowerCase('pt-BR'); let visible=0;\n      cards.forEach(card=>{const ok=card.textContent.toLocaleLowerCase('pt-BR').includes(q); card.style.display=ok?'flex':'none'; if(ok) visible++;});\n      if(empty) empty.style.display=visible?'none':'block';\n    });\n  }\n  // Countdown for the highlighted next event. It reads the date from the existing next-event metadata.\n  const next=document.querySelector('.next-event');\n  if(next){\n    const meta=next.querySelector('.next-meta');\n    const match=meta && meta.textContent.match(/(\\d{1,2})\\/(\\d{1,2})\\/(\\d{4})/);\n    if(match){\n      const day=+match[1], month=+match[2]-1, year=+match[3];\n      const target=new Date(year,month,day,0,0,0);\n      const copy=next.querySelector('.next-copy');\n      if(copy && !copy.querySelector('.countdown')){\n        const wrap=document.createElement('div'); wrap.className='countdown'; wrap.setAttribute('aria-label','Contagem regressiva para o próximo evento');\n        wrap.innerHTML='<div class="countdown-box"><span id="cdDays" class="countdown-num">--</span><span class="countdown-label">Dias</span></div><div class="countdown-box"><span id="cdHours" class="countdown-num">--</span><span class="countdown-label">Horas</span></div><div class="countdown-box"><span id="cdMinutes" class="countdown-num">--</span><span class="countdown-label">Min</span></div><div class="countdown-box"><span id="cdSeconds" class="countdown-num">--</span><span class="countdown-label">Seg</span></div>';\n        const cta=copy.querySelector('.next-cta'); cta ? copy.insertBefore(wrap,cta) : copy.appendChild(wrap);\n        const tick=()=>{let diff=target-Date.now(); if(diff<0) diff=0; const d=Math.floor(diff/86400000),h=Math.floor(diff/3600000)%24,m=Math.floor(diff/60000)%60,sec=Math.floor(diff/1000)%60; document.getElementById('cdDays').textContent=String(d).padStart(2,'0');document.getElementById('cdHours').textContent=String(h).padStart(2,'0');document.getElementById('cdMinutes').textContent=String(m).padStart(2,'0');document.getElementById('cdSeconds').textContent=String(sec).padStart(2,'0');}; tick(); setInterval(tick,1000);\n      }\n    }\n  }\n})();\n</script>\n'''
              s=s.replace('</body>',js+'</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit generated changes and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'feat: add WhatsApp contact event search and countdown'
          git push
          git rm .github/workflows/enhance-contact-search-countdown.yml || true
          git commit -m 'chore: remove one-time enhancement workflow' || true
          git push || true
