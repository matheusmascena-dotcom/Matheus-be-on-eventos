name: BeOn V3 upgrade
on:
  push:
    paths:
      - 'scripts/beon-v3.py'
      - '.github/workflows/beon-v3-upgrade.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upgrade:
    if: ${{ !contains(github.event.head_commit.message, '[beon-v3]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply BeOn V3 patch
        run: python3 scripts/beon-v3.py
      - name: Commit BeOn V3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html event.html scripts/beon-v3.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: BeOn V3 professional mobile, favorites, sharing, maps and admin [beon-v3]"
          git push
