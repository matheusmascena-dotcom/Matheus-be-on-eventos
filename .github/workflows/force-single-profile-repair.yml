name: Force single profile repair

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-single-profile-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[single-profile-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recover exact uploaded photo from Git history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          PHOTO_WORKFLOW_COMMIT=$(git log --format=%H --all -- '.github/workflows/finalize-profile-presentation.yml' | head -n 1)
          test -n "$PHOTO_WORKFLOW_COMMIT"
          git show "$PHOTO_WORKFLOW_COMMIT:.github/workflows/finalize-profile-presentation.yml" > /tmp/finalize-profile.yml
          python3 - <<'PY'
          from pathlib import Path
          import re, base64
          text=Path('/tmp/finalize-profile.yml').read_text(encoding='utf-8')
          m=re.search(r"cat > /tmp/profile\.b64 <<'B64'\n(.*?)\nB64", text, re.S)
          if not m:
              raise SystemExit('Exact uploaded profile payload not found in Git history')
          raw=base64.b64decode(''.join(m.group(1).split()))
          Path('assets/profile-matheus-uploaded.jpg').write_bytes(raw)
          print('profile bytes:', len(raw))
          PY
          test -s assets/profile-matheus-uploaded.jpg

      - name: Restore bottom presentation and preserve current site features
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          photo='assets/profile-matheus-uploaded.jpg?v=20260820'
          instagram='https://www.instagram.com/mat_mascena97/'
          whatsapp='https://w.app/matheusalves-fale-comigo'

          # Only the active top profile image reference changes; event grid/search/favorites/etc. stay untouched.
          s=re.sub(r'src="(?:profile-photo\.svg|assets/profile-matheus(?:\.svg|\.png|\.jpg)|assets/matheus-profile\.jpg)(?:\?[^\"]*)?"', f'src="{photo}"', s, count=1)

          # Rebuild exactly one bottom ambassador presentation.
          s=re.sub(r'<section id="ambassador-bottom-presentation"[\s\S]*?</section>\s*', '', s, count=1)
          full=('Olá, tudo bem? Me chamo Matheus Mascena e sou um dos embaixadores da Be-On e, assim como você, sou apaixonado por música eletrônica e todas as suas vertentes. Pensando nisso, criei este espaço para facilitar a vida dos amantes da música eletrônica que buscam obter descontos para seus eventos favoritos. Utilize meu cupom <strong>MATHEUSMASCENA</strong> e garanta <strong>5% de desconto</strong> na compra do seu ingresso.')
          block=f'''<section id="ambassador-bottom-presentation" class="ambassador-bottom wrap" aria-label="Apresentação do embaixador"><div class="ambassador-bottom-card"><div class="ambassador-bottom-photo"><img src="{photo}" alt="Matheus Alves Mascena" width="220" height="320" loading="lazy" decoding="async"></div><div class="ambassador-bottom-copy"><span class="eyebrow">CONHEÇA O EMBAIXADOR</span><h2>Matheus Alves Mascena</h2><div class="role">Embaixador Be-On · 29 anos</div><p>{full}</p><div class="amb-links"><a href="{instagram}" target="_blank" rel="noopener">📷 Instagram</a><a href="{whatsapp}" target="_blank" rel="noopener">💬 WhatsApp</a></div></div></div></section>'''
          if '</main>' not in s:
              raise SystemExit('</main> not found')
          s=s.replace('</main>',block+'\n</main>',1)
          css='''<style id="beon-ambassador-bottom-final">.ambassador-bottom{padding:12px 22px 38px}.ambassador-bottom-card{display:grid;grid-template-columns:220px 1fr;gap:28px;align-items:center;padding:25px;border:1px solid #7c5cff66;border-radius:24px;background:linear-gradient(135deg,#7c5cff18,#ff2f9209,#3fe0d007),#0d0914dd;box-shadow:0 24px 60px #0008,0 0 50px #7c5cff12;overflow:hidden}.ambassador-bottom-photo img{display:block;width:220px;height:320px;object-fit:cover;border-radius:18px;border:1px solid #3fe0d088;box-shadow:0 0 0 1px #7c5cff22,0 0 38px #7c5cff18}.ambassador-bottom-copy h2{font:40px/.95 'Bebas Neue';margin:10px 0 5px;background:linear-gradient(100deg,#fff,#3fe0d0,#8e77ff,#ff2f92);-webkit-background-clip:text;color:transparent}.ambassador-bottom-copy .role{color:#a49ab5;font-size:12px;margin-bottom:15px}.ambassador-bottom-copy p{font-size:14px;line-height:1.85;color:#c5bccf;margin:0}.ambassador-bottom-copy strong{color:#3fe0d0}@media(max-width:700px){.ambassador-bottom-card{grid-template-columns:1fr;text-align:center}.ambassador-bottom-photo img{margin:auto;width:min(220px,70vw);height:auto;aspect-ratio:3/4}.ambassador-bottom-copy .amb-links{justify-content:center}}</style>'''
          if 'id="beon-ambassador-bottom-final"' not in s:
              s=s.replace('</head>',css+'\n</head>',1)

          # Lock contacts to the exact URLs supplied by the owner.
          s=re.sub(r'href="https://www\.instagram\.com/[^"]*"', f'href="{instagram}"', s)
          s=re.sub(r'href="(?:https://wa\.me/[^\"]*|https://w\.app/[^\"]*)"', f'href="{whatsapp}"', s)
          p.write_text(s,encoding='utf-8')

      - name: Verify final state
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'assets/profile-matheus-uploaded.jpg' index.html
          grep -F 'id="ambassador-bottom-presentation"' index.html
          grep -F 'https://www.instagram.com/mat_mascena97/' index.html
          grep -F 'https://w.app/matheusalves-fale-comigo' index.html
          test -s assets/profile-matheus-uploaded.jpg

      - name: Publish consolidated state and retire this repair workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/force-single-profile-repair.yml || true
          git add index.html assets/profile-matheus-uploaded.jpg
          git commit -m 'fix: publish exact profile photo and restore bottom presentation [single-profile-repair]'
          git push
