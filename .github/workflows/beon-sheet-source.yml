name: BeOn — fonte única pela planilha

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/Eventos - Be On _ 2026(5)_V3_Final.xlsx'
      - '.github/workflows/beon-sheet-source.yml'

permissions:
  contents: write

concurrency:
  group: beon-sheet-sync
  cancel-in-progress: true

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[sheet-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependências
        run: pip install openpyxl pillow

      - name: Sincronizar Configurações do Site + foto do Drive
        run: python scripts/sync_site_config.py

      - name: Validar publicação
        run: |
          test -s assets/profile-matheus.jpg
          grep -R 'assets/profile-matheus.jpg?v=sheet' index.html
          grep -F 'mat_mascena97' index.html
          grep -F 'w.app/matheusalves-fale-comigo' index.html
          test -s site-config.json

      - name: Publicar no main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html event.html assets/profile-matheus.jpg site-config.json
          git commit -m 'sync: planilha como fonte única do site [sheet-sync]' || exit 0
          git push
