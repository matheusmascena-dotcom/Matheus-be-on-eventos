name: Apply Event Navigation Fix

on:
  push:
    paths:
      - 'scripts/fix-event-navigation.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Aplicar patch
        run: python scripts/fix-event-navigation.py
      - name: Validar
        run: |
          grep -q "beon-event-preview:" assets/beon-v4.js
          grep -q "unreal-the-grid.*unreal-x-the-grid" event.html
          grep -q "published=eq.true" event.html
      - name: Publicar
        run: |
          rm -f scripts/fix-event-navigation.py .github/workflows/test-temp.yml .github/workflows/fix-event-page-navigation-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: acelerar abertura e corrigir evento selecionado'
          git push
