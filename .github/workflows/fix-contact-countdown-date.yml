name: Fix ambassador contact and photo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download current Instagram avatar and fix references
        shell: bash
        run: |
          set -e
          mkdir -p assets
          curl -L --fail --retry 3 --connect-timeout 15 --max-time 45 'https://unavatar.io/instagram/mat_mascena97' -o assets/matheus-profile.jpg
          python - <<'PY'
          from pathlib import Path
          import re
          instagram='https://www.instagram.com/mat_mascena97/'
          whatsapp='https://w.app/matheusalves-fale-comigo'
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('https://www.instagram.com/matheusmascena/', instagram)
          s=re.sub(r'https://wa\\.me/\\?text=[^"\'<> ]*', whatsapp, s)
          s=s.replace('src="profile-photo.svg"','src="assets/matheus-profile.jpg" width="170" height="240" loading="eager" fetchpriority="high" decoding="async"')
          s=s.replace('src="assets/profile-matheus.svg"','src="assets/matheus-profile.jpg" width="170" height="240" loading="eager" fetchpriority="high" decoding="async"')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/matheus-profile.jpg
          git commit -m 'fix: correct Instagram WhatsApp and local profile photo [profile-contact-fix]'
          git push
          git rm .github/workflows/fix-contact-countdown-date.yml
          git commit -m 'chore: remove one-time contact fix workflow [profile-contact-fix]'
          git push
