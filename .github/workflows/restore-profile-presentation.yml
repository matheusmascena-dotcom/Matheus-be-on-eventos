name: Consolidate ambassador presentation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-profile-presentation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidate:
    if: ${{ !contains(github.event.head_commit.message, '[presentation-consolidated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore top and bottom ambassador presentation consistently
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # One stable source for the profile photo on the site.
          s = s.replace('src="assets/matheus-profile.jpg"', 'src="profile-photo.svg"')
          s = s.replace('src="assets/profile-matheus.svg"', 'src="profile-photo.svg"')
          s = s.replace('src="assets/profile-matheus.png"', 'src="profile-photo.svg"')

          # Keep the current premium top presentation intact and make sure it uses the local image.
          s = re.sub(r'<img([^>]*?)src="(?:profile-photo\.svg|assets/matheus-profile\.jpg|assets/profile-matheus\.svg|assets/profile-matheus\.png)"([^>]*)>',
                     lambda m: '<img'+m.group(1)+'src="profile-photo.svg"'+m.group(2)+'>', s, count=1, flags=re.I)

          # Restore the full presentation below the event grid as requested.
          if 'id="ambassador-bottom-presentation"' not in s:
              block = '''
<section id="ambassador-bottom-presentation" class="ambassador-bottom wrap" aria-label="Apresentação do embaixador">
  <div class="ambassador-bottom-card">
    <div class="ambassador-bottom-photo">
      <img src="profile-photo.svg" alt="Matheus Alves Mascena" width="220" height="320" loading="lazy" decoding="async">
    </div>
    <div class="ambassador-bottom-copy">
      <span class="eyebrow">CONHEÇA O EMBAIXADOR</span>
      <h2>Matheus Alves Mascena</h2>
      <div class="role">Embaixador Be-On · 29 anos</div>
      <p>Olá, tudo bem? Me chamo Matheus Mascena e sou um dos embaixadores da Be-On e, assim como você, sou apaixonado por música eletrônica e todas as suas vertentes. Pensando nisso, criei este espaço para facilitar a vida dos amantes da música eletrônica que buscam obter descontos para seus eventos favoritos. Utilize meu cupom <strong>MATHEUSMASCENA</strong> e garanta <strong>5% de desconto</strong> na compra do seu ingresso.</p>
      <div class="amb-links">
        <a href="https://www.instagram.com/mat_mascena97/" target="_blank" rel="noopener">📷 Instagram</a>
        <a href="https://w.app/matheusalves-fale-comigo" target="_blank" rel="noopener">💬 WhatsApp</a>
      </div>
    </div>
  </div>
</section>
'''
              s = s.replace('</main>', block + '\n</main>', 1) if '</main>' in s else s + block

          css = '''<style id="beon-ambassador-bottom">\
.ambassador-bottom{padding:18px 22px 38px}.ambassador-bottom-card{display:grid;grid-template-columns:220px 1fr;gap:28px;align-items:center;padding:25px;border:1px solid #7c5cff66;border-radius:24px;background:linear-gradient(135deg,#7c5cff18,#ff2f9209,#3fe0d007),#0d0914dd;box-shadow:0 24px 60px #0008,0 0 50px #7c5cff12;overflow:hidden}.ambassador-bottom-photo img{width:220px;height:320px;display:block;object-fit:cover;border-radius:18px;border:1px solid #3fe0d088;box-shadow:0 0 0 1px #7c5cff22,0 0 38px #7c5cff18}.ambassador-bottom-copy h2{font:40px/.95 'Bebas Neue';margin:10px 0 5px;background:linear-gradient(100deg,#fff,#3fe0d0,#8e77ff,#ff2f92);-webkit-background-clip:text;color:transparent}.ambassador-bottom-copy .role{color:#a49ab5;font-size:12px;margin-bottom:15px}.ambassador-bottom-copy p{font-size:14px;line-height:1.85;color:#c5bccf;margin:0}.ambassador-bottom-copy strong{color:#3fe0d0}.ambassador-bottom-copy .amb-links{margin-top:16px}@media(max-width:700px){.ambassador-bottom-card{grid-template-columns:1fr;text-align:center}.ambassador-bottom-photo img{margin:auto;width:min(220px,70vw);height:auto;aspect-ratio:3/4}.ambassador-bottom-copy .amb-links{justify-content:center}}\
</style>'''
          if 'id="beon-ambassador-bottom"' not in s:
              s = s.replace('</head>', css + '\n</head>', 1)

          p.write_text(s, encoding='utf-8')

      - name: Verify presentation references
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'src="profile-photo.svg"' index.html
          grep -F 'id="ambassador-bottom-presentation"' index.html
          grep -F 'https://www.instagram.com/mat_mascena97/' index.html
          grep -F 'https://w.app/matheusalves-fale-comigo' index.html

      - name: Commit final presentation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: consolidate top and bottom ambassador presentation [presentation-consolidated]'
          git push