name: Restore ambassador presentation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-profile-presentation.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore ambassador presentation section
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          photo='profile-photo.svg'
          s=s.replace('src="assets/profile-matheus.png"', 'src="'+photo+'"')
          s=s.replace('src="assets/profile-matheus.svg"', 'src="'+photo+'"')
          s=s.replace('src="assets/matheus-profile.jpg"', 'src="'+photo+'"')
          if 'id="ambassador-bottom-presentation"' not in s:
              block='''<section id="ambassador-bottom-presentation" class="ambassador-bottom wrap" aria-label="Apresentação do embaixador"><div class="ambassador-bottom-card"><div class="ambassador-bottom-photo"><img src="profile-photo.svg" alt="Matheus Alves Mascena" width="220" height="320" loading="lazy" decoding="async"></div><div class="ambassador-bottom-copy"><span class="eyebrow">CONHEÇA O EMBAIXADOR</span><h2>Matheus Alves Mascena</h2><div class="role">Embaixador Be-On · 29 anos</div><p>Olá, tudo bem? Me chamo Matheus Mascena e sou um dos embaixadores da Be-On e, assim como você, sou apaixonado por música eletrônica e todas as suas vertentes. Pensando nisso, criei este espaço para facilitar a vida dos amantes da música eletrônica que buscam obter descontos para seus eventos favoritos. Utilize meu cupom <strong>MATHEUSMASCENA</strong> e garanta <strong>5% de desconto</strong> na compra do seu ingresso.</p><div class="amb-links"><a href="https://www.instagram.com/mat_mascena97/" target="_blank" rel="noopener">📷 Instagram</a><a href="https://w.app/matheusalves-fale-comigo" target="_blank" rel="noopener">💬 WhatsApp</a></div></div></div></section>'''
              s=s.replace('</main>',block+'\n</main>',1) if '</main>' in s else s+block
          css='''<style id="beon-ambassador-bottom">.ambassador-bottom{padding:10px 22px 35px}.ambassador-bottom-card{display:grid;grid-template-columns:220px 1fr;gap:26px;align-items:center;padding:24px;border:1px solid #7c5cff55;border-radius:24px;background:linear-gradient(135deg,#7c5cff15,#ff2f9208,#3fe0d006),#0d0914dd;box-shadow:0 20px 55px #0008,0 0 45px #7c5cff0c;overflow:hidden}.ambassador-bottom-photo img{width:220px;height:320px;display:block;object-fit:cover;border-radius:18px;border:1px solid #3fe0d080;box-shadow:0 0 35px #7c5cff16}.ambassador-bottom-copy h2{font:38px/.95 'Bebas Neue';margin:10px 0 4px;background:linear-gradient(100deg,#fff,#3fe0d0,#8e77ff,#ff2f92);-webkit-background-clip:text;color:transparent}.ambassador-bottom-copy .role{color:#a49ab5;font-size:12px;margin-bottom:14px}.ambassador-bottom-copy p{font-size:14px;line-height:1.85;color:#c5bccf;margin:0}.ambassador-bottom-copy strong{color:#3fe0d0}.ambassador-bottom-copy .amb-links{margin-top:16px}@media(max-width:700px){.ambassador-bottom-card{grid-template-columns:1fr;text-align:center}.ambassador-bottom-photo img{margin:auto;width:min(220px,70vw);height:auto;aspect-ratio:3/4}.ambassador-bottom-copy .amb-links{justify-content:center}}</style>'''
          if 'id="beon-ambassador-bottom"' not in s:
              s=s.replace('</head>',css+'\n</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: restore complete ambassador presentation at bottom [restore-presentation]'
          git push
