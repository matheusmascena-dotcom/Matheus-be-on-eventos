name: Fix profile contact and photo

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-profile-contact-photo.yml'

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[profile-contact-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download current Instagram avatar locally
        run: |
          set -e
          mkdir -p assets
          curl -L --fail --retry 3 --connect-timeout 15 --max-time 45 \
            'https://unavatar.io/instagram/mat_mascena97' \
            -o assets/matheus-profile.jpg
          file assets/matheus-profile.jpg

      - name: Fix Instagram, WhatsApp and profile image references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          instagram = 'https://www.instagram.com/mat_mascena97/'
          whatsapp = 'https://w.app/matheusalves-fale-comigo'

          for name in ('index.html', 'event.html'):
              p = Path(name)
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')

              # Correct personal Instagram URL everywhere it appears.
              s = s.replace('https://www.instagram.com/matheusmascena/', instagram)

              # Replace any previous generic WhatsApp link used by the V3 navigation/profile.
              s = re.sub(r'https://wa\.me/\?text=[^"\'<> ]*', whatsapp, s)

              # Use the locally stored optimized photo in the ambassador presentation.
              s = s.replace('src="profile-photo.svg"',
                            'src="assets/matheus-profile.jpg" width="170" height="240" loading="eager" fetchpriority="high" decoding="async"')

              p.write_text(s, encoding='utf-8')

          # Remove the old slow/failing SVG from active references; keep the file itself as a historical backup.
          PY

      - name: Commit corrected contacts and local profile photo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html event.html assets/matheus-profile.jpg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: use correct Instagram and WhatsApp links and local profile photo [profile-contact-fix]'
          git push
