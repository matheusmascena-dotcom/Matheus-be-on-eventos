name: Sync Drive galleries and visual update

on:
  push:
    paths:
      - '.github/workflows/drive-gallery-and-visual-update.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  SYNC_REVISION: '2026-08-20-card-fix-2'

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[drive-gallery-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install tools
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install gdown pillow

      - name: Sync galleries without destructive fallback
        env:
          MUSIC_ON_DRIVE: 'https://drive.google.com/drive/folders/12fRYhu6hrB8qkIEjTRtMX0-AnSQeyJXO?usp=sharing'
          ONE_LIFE_DRIVE: 'https://drive.google.com/drive/folders/11FUlmMiVFobyh8O_FYjaScR9AkXfqkrh?usp=sharing'
          THE_GRID_DRIVE: 'https://drive.google.com/drive/folders/1HL4FvP5ABw9__7yuSHe_DZA1FwANSTEk?usp=sharing'
          ADRIATIQUE_DRIVE: 'https://drive.google.com/drive/folders/1Cq11QSAfy7gTTgpri4kGjvnJrWcs9nGJ?usp=sharing'
          CROCHESTRA_DRIVE: 'https://drive.google.com/drive/folders/1QixvAOaAHKh5Vp91GyrDCWmHQG6l6jhz?usp=drive_link'
        run: |
          python3 - <<'PY'
          import os, json, shutil, subprocess, pathlib
          from PIL import Image

          root=pathlib.Path('.')
          gallery_root=root/'assets'/'galleries'
          cover_root=root/'assets'/'covers'
          gallery_root.mkdir(parents=True, exist_ok=True)
          cover_root.mkdir(parents=True, exist_ok=True)

          galleries={
            'music-on-sao-paulo': (os.environ['MUSIC_ON_DRIVE'], [
              {'label':'BeOn Entertainment','instagram':'https://www.instagram.com/beonentertainment/','icon':'📷'},
              {'label':'@clickdoclayton','instagram':'https://www.instagram.com/clickdoclayton/','icon':'📷'}
            ]),
            'one-life-sao-paulo': (os.environ['ONE_LIFE_DRIVE'], [
              {'label':'BeOn Entertainment','instagram':'https://www.instagram.com/beonentertainment/','icon':'📷'}
            ]),
            'the-grid-outworld': (os.environ['THE_GRID_DRIVE'], [
              {'label':'BeOn Entertainment','instagram':'https://www.instagram.com/beonentertainment/','icon':'📷'},
              {'label':'@pedrofatore_','instagram':'https://www.instagram.com/pedrofatore_/','icon':'📷'}
            ]),
            'adriatique-x-sao-paulo': (os.environ['ADRIATIQUE_DRIVE'], [
              {'label':'BeOn Entertainment','instagram':'https://www.instagram.com/beonentertainment/','icon':'📷'},
              {'label':'@pedrofatore_','instagram':'https://www.instagram.com/pedrofatore_/','icon':'📷'}
            ]),
            'crochestra-brasil': (os.environ['CROCHESTRA_DRIVE'], [])
          }

          def sync_gallery(url, slug):
              tmp=pathlib.Path('/tmp/drive_'+slug)
              if tmp.exists(): shutil.rmtree(tmp)
              tmp.mkdir(parents=True)
              cmd=['gdown','--folder',url,'--output',str(tmp),'--remaining-ok']
              r=subprocess.run(cmd, text=True, capture_output=True)
              print(f'[{slug}] gdown exit={r.returncode}')
              if r.stdout: print(r.stdout[-4000:])
              if r.stderr: print(r.stderr[-4000:])
              if r.returncode!=0:
                  return 0
              files=[p for p in tmp.rglob('*') if p.is_file() and p.suffix.lower() in {'.jpg','.jpeg','.png','.webp','.gif'}]
              files.sort(key=lambda p:p.name.lower())
              if not files:
                  return 0

              out=gallery_root/slug
              stage=pathlib.Path('/tmp/stage_'+slug)
              if stage.exists(): shutil.rmtree(stage)
              stage.mkdir(parents=True)

              count=0
              for p in files[:20]:
                  try:
                      im=Image.open(p).convert('RGB')
                      count+=1
                      im.save(stage/f'{count:02d}.jpg', 'JPEG', quality=94, optimize=True, progressive=True)
                  except Exception as e:
                      print('image conversion failed',p,e)

              if count==0:
                  return 0

              if out.exists(): shutil.rmtree(out)
              stage.rename(out)
              return count

          for slug,(url,credits) in galleries.items():
              count=sync_gallery(url,slug)
              json_path=gallery_root/f'{slug}.json'
              if count>0:
                  photos=[{'src':f'assets/galleries/{slug}/{i:02d}.jpg','name':f'{i:02d}'} for i in range(1,min(count,8)+1)]
                  payload={'photos':photos,'credits':credits,'sourceFolder':url,'warning':None}
                  json_path.write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
                  print(f'[{slug}] synchronized {count} images')
              else:
                  print(f'[{slug}] download failed or empty; preserving existing gallery files')

          covers={
            'unreal-the-grid':'https://imgproxy.ra.co/_/quality:66/aHR0cHM6Ly9pbWFnZXMucmEuY28vZjg3ZmU1MjM5ZTg3MzA0ZjkzZWQ2NDA1MjE3NzNlNWFmODY1NjMxOS5qcGc=',
            'the-grid-outworld':'https://media.betimelapse.com.br/uploads/2026/05/1779991359288_The_Grid_Outworld_Klangkuenstler_2026_-_Capa_Timelapse.jpg',
            'adriatique-x-sao-paulo':'https://kraken.ingresse.com/event/posters/91444/large/1773685318.8785126.jpg',
            'crochestra-brasil':'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcREHeNVMidXoiwj9uvvhUIu8g8hf2E4Zck8u8Rg0EA7nHSjPLA3TSD6ypjA&s=10',
            'music-on-sao-paulo':'https://api.wegoout.com.br/images/events/642/full_music-on-sp.webp',
            'one-life-sao-paulo':'https://media.betimelapse.com.br/uploads/2026/05/1779302100069_One_Life_SP_2026_-_Capa_Timelapse.jpg'
          }
          import urllib.request
          for slug,url in covers.items():
              ext='.webp' if '.webp' in url.lower() else '.jpg'
              dest=cover_root/f'{slug}{ext}'
              if dest.exists() and dest.stat().st_size>10000:
                  continue
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=30) as r, open(dest,'wb') as f:
                      shutil.copyfileobj(r,f)
                  print('cover saved',dest)
              except Exception as e:
                  print('cover download failed',slug,e)

          index=root/'index.html'
          if index.exists():
              s=index.read_text(encoding='utf-8')
              replacements={
                covers['unreal-the-grid']:'assets/covers/unreal-the-grid.jpg',
                covers['the-grid-outworld']:'assets/covers/the-grid-outworld.jpg',
                covers['adriatique-x-sao-paulo']:'assets/covers/adriatique-x-sao-paulo.jpg',
                covers['crochestra-brasil']:'assets/covers/crochestra-brasil.jpg',
                covers['music-on-sao-paulo']:'assets/covers/music-on-sao-paulo.webp',
                covers['one-life-sao-paulo']:'assets/covers/one-life-sao-paulo.jpg'
              }
              for old,new in replacements.items(): s=s.replace(old,new)
              for slug in ['the-grid-outworld','adriatique-x-sao-paulo','crochestra-brasil','one-life-sao-paulo']:
                  s=s.replace(f'assets/covers/{slug}.webp',f'assets/covers/{slug}.jpg')
              s=s.replace('assets/covers/unreal-the-grid.webp','assets/covers/unreal-the-grid.jpg')
              index.write_text(s,encoding='utf-8')

          event=root/'event.html'
          if event.exists():
              s=event.read_text(encoding='utf-8')
              replacements={
                covers['unreal-the-grid']:'assets/covers/unreal-the-grid.jpg',
                covers['the-grid-outworld']:'assets/covers/the-grid-outworld.jpg',
                covers['adriatique-x-sao-paulo']:'assets/covers/adriatique-x-sao-paulo.jpg',
                covers['crochestra-brasil']:'assets/covers/crochestra-brasil.jpg',
                covers['music-on-sao-paulo']:'assets/covers/music-on-sao-paulo.webp',
                covers['one-life-sao-paulo']:'assets/covers/one-life-sao-paulo.jpg'
              }
              for old,new in replacements.items(): s=s.replace(old,new)
              for slug in ['the-grid-outworld','adriatique-x-sao-paulo','crochestra-brasil','one-life-sao-paulo']:
                  s=s.replace(f'assets/covers/{slug}.webp',f'assets/covers/{slug}.jpg')
              s=s.replace('assets/covers/unreal-the-grid.webp','assets/covers/unreal-the-grid.jpg')
              s=s.replace('<p data-t="photoText">Galeria premium com até 8 fotos selecionadas. Toque ou clique em uma foto para abrir em tela cheia.</p>','')
              s=s.replace("grid.innerHTML='<div class=\\\"gallery-empty\\\">As fotos desta galeria estão sendo preparadas.</div>';credit.innerHTML='';return", "grid.innerHTML='';credit.innerHTML='';document.getElementById('gallery').style.display='none';return")
              s=s.replace("{label:'Tim Buiting',instagram:null,icon:'📷'}", "{label:'@pedrofatore_',instagram:'https://www.instagram.com/pedrofatore_/',icon:'📷'}")
              event.write_text(s,encoding='utf-8')

          print('sync revision',os.environ.get('SYNC_REVISION'))
          PY

      - name: Apply visual readability refinements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['index.html','event.html']:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              if name=='index.html':
                  css='''<style id="beon-fix-image-v5">\nbody{font-size:16px}.amb-wrap{padding-bottom:6px}.hero{padding-top:18px}.hero .ey{margin-top:0;font-size:11px}.hero p{font-size:15px;line-height:1.7}.head p{font-size:14px}.box h3,.card h3{font-size:16px}.box p,.meta{font-size:13px;line-height:1.6}.loc,.buy{font-size:12px;padding:11px}.pic{height:250px}.pic img{image-rendering:auto;object-fit:contain}.profile p{font-size:13px}.profile .links a{font-size:12px}.footer-intro{font-size:13px}@media(max-width:760px){.amb-wrap{padding-bottom:4px}.hero{padding-top:12px}.hero p{font-size:14px}.box p,.meta{font-size:13px}.cards .pic{height:240px}.profile p{font-size:13px}}\n</style>'''
              else:
                  css='''<style id="beon-fix-image-v5">\nbody{font-size:16px}.lead{font-size:14px}.detail small{font-size:10px}.detail strong{font-size:14px}.btn{font-size:12px;padding:12px}.gallery>p{display:none}.beon-gallery-credit{font-size:12px}.gallery h2{font-size:33px}@media(max-width:760px){.lead{font-size:14px}.detail strong{font-size:14px}.beon-gallery-credit{font-size:12px}}\n</style>'''
              if 'beon-fix-image-v5' not in s: s=s.replace('</head>',css+'</head>',1)
              p.write_text(s,encoding='utf-8')
          PY

      - name: Commit repaired galleries and visuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html event.html assets/galleries assets/covers
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: restore galleries and image loading [drive-gallery-sync]"
          git push
