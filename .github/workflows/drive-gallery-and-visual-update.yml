name: Sync Drive galleries and visual update

on:
  push:
    paths:
      - '.github/workflows/drive-gallery-and-visual-update.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  MAX_IMPORT: '20'
  MAX_DISPLAY: '20'

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[drive-gallery-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install tools
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install gdown pillow

      - name: Sync Drive galleries and create diagnostic report
        env:
          MUSIC_ON_DRIVE: 'https://drive.google.com/drive/folders/12fRYhu6hrB8qkIEjTRtMX0-AnSQeyJXO?usp=sharing'
          ONE_LIFE_DRIVE: 'https://drive.google.com/drive/folders/11FUlmMiVFobyh8O_FYjaScR9AkXfqkrh?usp=sharing'
          THE_GRID_DRIVE: 'https://drive.google.com/drive/folders/1HL4FvP5ABw9__7yuSHe_DZA1FwANSTEk?usp=sharing'
          ADRIATIQUE_DRIVE: 'https://drive.google.com/drive/folders/1ZSApcvWB5NM_SwFd_2PwgK_sU6fH4HAR?usp=sharing'
          CROCHESTRA_DRIVE: 'https://drive.google.com/drive/folders/1GLIzv4CL_uxEsY7GlNGuYvxr1VeeqXkQ?usp=sharing'
        run: |
          python3 - <<'PY'
          import os, json, shutil, subprocess, pathlib
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          from PIL import Image

          root = pathlib.Path('.')
          gallery_root = root / 'assets' / 'galleries'
          gallery_root.mkdir(parents=True, exist_ok=True)

          galleries = {
            'music-on-sao-paulo': (os.environ['MUSIC_ON_DRIVE'], [
              {'label':'BeOn Entertainment','instagram':'https://www.instagram.com/beonentertainment/','icon':'📷'},
              {'label':'@clickdoclayton','instagram':'https://www.instagram.com/clickdoclayton/','icon':'📷'}
            ]),
            'one-life-sao-paulo': (os.environ['ONE_LIFE_DRIVE'], [
              {'label':'BeOn Entertainment','instagram':'https://www.instagram.com/beonentertainment/','icon':'📷'}
            ]),
            'the-grid-outworld': (os.environ['THE_GRID_DRIVE'], [
              {'label':'BeOn Entertainment','instagram':'https://www.instagram.com/beonentertainment/','icon':'📷'},
              {'label':'@pedrofatore_','instagram':'https://www.instagram.com/pedrofatore_/','icon':'📷'}
            ]),
            'adriatique-x-sao-paulo': (os.environ['ADRIATIQUE_DRIVE'], [
              {'label':'BeOn Entertainment','instagram':'https://www.instagram.com/beonentertainment/','icon':'📷'},
              {'label':'@pedrofatore_','instagram':'https://www.instagram.com/pedrofatore_/','icon':'📷'}
            ]),
            'crochestra-brasil': (os.environ['CROCHESTRA_DRIVE'], [])
          }

          labels = {
            'music-on-sao-paulo':'Music On',
            'one-life-sao-paulo':'One Life',
            'the-grid-outworld':'The Grid',
            'adriatique-x-sao-paulo':'Adriatique',
            'crochestra-brasil':'Crochestra'
          }

          max_import = int(os.environ.get('MAX_IMPORT', '20'))
          max_display = int(os.environ.get('MAX_DISPLAY', '20'))
          results = {}

          def http_probe(url):
              try:
                  req = Request(url, headers={'User-Agent':'Mozilla/5.0'})
                  with urlopen(req, timeout=30) as r:
                      sample = r.read(5000).decode('utf-8', 'ignore')
                      return {'http': r.status, 'content_type': r.headers.get('content-type',''), 'final_url': r.geturl(), 'sample': sample[:300]}
              except HTTPError as e:
                  return {'http': e.code, 'content_type': '', 'final_url': getattr(e, 'url', url), 'sample': str(e)}
              except URLError as e:
                  return {'http': 'ERROR', 'content_type': '', 'final_url': url, 'sample': str(e.reason)}
              except Exception as e:
                  return {'http': 'ERROR', 'content_type': '', 'final_url': url, 'sample': str(e)}

          def sync_gallery(url, slug, credits):
              probe = http_probe(url)
              tmp = pathlib.Path('/tmp/drive_' + slug)
              if tmp.exists(): shutil.rmtree(tmp)
              tmp.mkdir(parents=True)

              cmd = ['gdown', '--folder', url, '--output', str(tmp)]
              r = subprocess.run(cmd, text=True, capture_output=True)
              stdout = (r.stdout or '')[-6000:]
              stderr = (r.stderr or '')[-6000:]

              files = []
              if r.returncode == 0:
                  files = [p for p in tmp.rglob('*') if p.is_file() and p.suffix.lower() in {'.jpg','.jpeg','.png','.webp','.gif','.bmp'}]
                  files.sort(key=lambda p: p.name.lower())

              if not files:
                  return {'status':'FAILED_OR_EMPTY','downloaded':0,'usable':0,'probe':probe,'gdown_exit':r.returncode,'stdout':stdout,'stderr':stderr}

              stage = pathlib.Path('/tmp/stage_' + slug)
              if stage.exists(): shutil.rmtree(stage)
              stage.mkdir(parents=True)

              usable = 0
              for p in files[:max_import]:
                  try:
                      im = Image.open(p).convert('RGB')
                      usable += 1
                      im.save(stage / f'{usable:02d}.jpg', 'JPEG', quality=94, optimize=True, progressive=True)
                  except Exception as e:
                      stderr += f'\nconversion: {p}: {e}'

              if usable == 0:
                  return {'status':'FAILED_OR_EMPTY','downloaded':len(files),'usable':0,'probe':probe,'gdown_exit':r.returncode,'stdout':stdout,'stderr':stderr}

              out = gallery_root / slug
              if out.exists(): shutil.rmtree(out)
              stage.rename(out)
              total = min(usable, max_display)
              payload = {
                  'photos':[{'src':f'assets/galleries/{slug}/{i:02d}.jpg','name':f'{i:02d}'} for i in range(1,total+1)],
                  'credits': credits,
                  'sourceFolder': url,
                  'warning': None,
                  'importedCount': usable
              }
              (gallery_root/f'{slug}.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              return {'status':'OK','downloaded':len(files),'usable':usable,'probe':probe,'gdown_exit':r.returncode,'stdout':stdout,'stderr':stderr}

          for slug,(url,credits) in galleries.items():
              results[slug] = sync_gallery(url, slug, credits)

          report = [
            '# Diagnóstico de sincronização do Google Drive','',
            f'Importação máxima: **{max_import} fotos por evento**. Exibição cadastrada: **{max_display}**.','',
            '| Evento | Resultado | HTTP | Arquivos encontrados | Processadas | gdown |',
            '|---|---|---:|---:|---:|---:|'
          ]
          for slug,res in results.items():
              report.append(f"| {labels[slug]} | {res['status']} | {res['probe']['http']} | {res['downloaded']} | {res['usable']} | {res['gdown_exit']} |")
          report += ['', '## Detalhes técnicos']
          for slug,res in results.items():
              report += [f"### {labels[slug]}", f"- URL final: `{res['probe']['final_url']}`", f"- Content-Type: `{res['probe']['content_type']}`", f"- Resposta HTTP: `{res['probe']['http']}`", f"- gdown exit: `{res['gdown_exit']}`"]
              if res['stderr']:
                  report += ['- Erro/saída do gdown:', '```text', res['stderr'][-3000:], '```']
              report.append('')
          report += ['## Interpretação','- **OK** = a pasta foi acessada e as fotos foram importadas.','- **FAILED_OR_EMPTY** = o runner chegou ao link, mas não conseguiu obter arquivos de imagem da pasta.']

          (root/'drive-sync-report.md').write_text('\n'.join(report)+'\n',encoding='utf-8')
          summary = ['## Resultado da sincronização do Drive']
          for slug,res in results.items():
              summary.append(f"- **{labels[slug]}**: `{res['status']}` — HTTP `{res['probe']['http']}`, {res['downloaded']} arquivos, {res['usable']} processados, gdown `{res['gdown_exit']}`.")
          pathlib.Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(summary)+'\n',encoding='utf-8')
          PY

      - name: Commit synchronization results and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/galleries drive-sync-report.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "sync: import up to 20 Drive photos and publish diagnostics [drive-gallery-sync]"
          git push
