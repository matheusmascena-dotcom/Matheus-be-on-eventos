name: Sync Drive galleries and visual update

on:
  push:
    paths:
      - '.github/workflows/drive-gallery-and-visual-update.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  MAX_IMPORT: '20'
  MAX_DISPLAY: '20'

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[drive-gallery-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install tools
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install gdown pillow

      - name: Sync Drive galleries and create diagnostic report
        env:
          MUSIC_ON_DRIVE: 'https://drive.google.com/drive/folders/12fRYhu6hrB8qkIEjTRtMX0-AnSQeyJXO?usp=sharing'
          ONE_LIFE_DRIVE: 'https://drive.google.com/drive/folders/11FUlmMiVFobyh8O_FYjaScR9AkXfqkrh?usp=sharing'
          THE_GRID_DRIVE: 'https://drive.google.com/drive/folders/1HL4FvP5ABw9__7yuSHe_DZA1FwANSTEk?usp=sharing'
          ADRIATIQUE_DRIVE: 'https://drive.google.com/drive/folders/1Cq11QSAfy7gTTgpri4kGjvnJrWcs9nGJ?usp=sharing'
          CROCHESTRA_DRIVE: 'https://drive.google.com/drive/folders/1QixvAOaAHKh5Vp91GyrDCWmHQG6l6jhz?usp=drive_link'
        run: |
          python3 - <<'PY'
          import os, json, shutil, subprocess, pathlib
          from PIL import Image

          root = pathlib.Path('.')
          gallery_root = root / 'assets' / 'galleries'
          cover_root = root / 'assets' / 'covers'
          gallery_root.mkdir(parents=True, exist_ok=True)
          cover_root.mkdir(parents=True, exist_ok=True)

          galleries = {
            'music-on-sao-paulo': (os.environ['MUSIC_ON_DRIVE'], [
              {'label':'BeOn Entertainment','instagram':'https://www.instagram.com/beonentertainment/','icon':'📷'},
              {'label':'@clickdoclayton','instagram':'https://www.instagram.com/clickdoclayton/','icon':'📷'}
            ]),
            'one-life-sao-paulo': (os.environ['ONE_LIFE_DRIVE'], [
              {'label':'BeOn Entertainment','instagram':'https://www.instagram.com/beonentertainment/','icon':'📷'}
            ]),
            'the-grid-outworld': (os.environ['THE_GRID_DRIVE'], [
              {'label':'BeOn Entertainment','instagram':'https://www.instagram.com/beonentertainment/','icon':'📷'},
              {'label':'@pedrofatore_','instagram':'https://www.instagram.com/pedrofatore_/','icon':'📷'}
            ]),
            'adriatique-x-sao-paulo': (os.environ['ADRIATIQUE_DRIVE'], [
              {'label':'BeOn Entertainment','instagram':'https://www.instagram.com/beonentertainment/','icon':'📷'},
              {'label':'@pedrofatore_','instagram':'https://www.instagram.com/pedrofatore_/','icon':'📷'}
            ]),
            'crochestra-brasil': (os.environ['CROCHESTRA_DRIVE'], [])
          }

          report = []
          results = {}
          max_import = int(os.environ.get('MAX_IMPORT', '20'))
          max_display = int(os.environ.get('MAX_DISPLAY', '20'))

          def sync_gallery(url, slug):
              tmp = pathlib.Path('/tmp/drive_' + slug)
              if tmp.exists():
                  shutil.rmtree(tmp)
              tmp.mkdir(parents=True)

              cmd = ['gdown', '--folder', url, '--output', str(tmp), '--remaining-ok', '--quiet']
              r = subprocess.run(cmd, text=True, capture_output=True)
              stdout = (r.stdout or '')[-3000:]
              stderr = (r.stderr or '')[-3000:]

              files = []
              if r.returncode == 0:
                  files = [p for p in tmp.rglob('*') if p.is_file() and p.suffix.lower() in {'.jpg','.jpeg','.png','.webp','.gif','.bmp'}]
                  files.sort(key=lambda p: p.name.lower())

              if not files:
                  return {'status':'FAILED_OR_EMPTY', 'downloaded':0, 'usable':0, 'stdout':stdout, 'stderr':stderr}

              stage = pathlib.Path('/tmp/stage_' + slug)
              if stage.exists():
                  shutil.rmtree(stage)
              stage.mkdir(parents=True)

              usable = 0
              for p in files[:max_import]:
                  try:
                      im = Image.open(p).convert('RGB')
                      usable += 1
                      im.save(stage / f'{usable:02d}.jpg', 'JPEG', quality=94, optimize=True, progressive=True)
                  except Exception as e:
                      print(f'[{slug}] image conversion failed: {p}: {e}')

              if usable == 0:
                  return {'status':'FAILED_OR_EMPTY', 'downloaded':len(files), 'usable':0, 'stdout':stdout, 'stderr':stderr}

              out = gallery_root / slug
              if out.exists():
                  shutil.rmtree(out)
              stage.rename(out)
              return {'status':'OK', 'downloaded':len(files), 'usable':usable, 'stdout':stdout, 'stderr':stderr}

          for slug, (url, credits) in galleries.items():
              result = sync_gallery(url, slug)
              results[slug] = result
              json_path = gallery_root / f'{slug}.json'

              if result['usable'] > 0:
                  total = min(result['usable'], max_display)
                  photos = [
                      {'src':f'assets/galleries/{slug}/{i:02d}.jpg', 'name':f'{i:02d}'}
                      for i in range(1, total + 1)
                  ]
                  payload = {
                      'photos': photos,
                      'credits': credits,
                      'sourceFolder': url,
                      'warning': None,
                      'importedCount': result['usable']
                  }
                  json_path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              else:
                  # Preserve the last known good gallery; do not destroy it because Drive was unavailable.
                  print(f'[{slug}] Drive unavailable or empty; preserving existing gallery files')

          labels = {
            'music-on-sao-paulo':'Music On',
            'one-life-sao-paulo':'One Life',
            'the-grid-outworld':'The Grid',
            'adriatique-x-sao-paulo':'Adriatique',
            'crochestra-brasil':'Crochestra'
          }

          report.append('# Diagnóstico de sincronização do Google Drive')
          report.append('')
          report.append(f'Importação máxima: **{max_import} fotos por evento**; limite de exibição cadastrado: **{max_display}**.')
          report.append('')
          report.append('| Evento | Resultado | Arquivos encontrados | Imagens processadas |')
          report.append('|---|---|---:|---:|')
          for slug, result in results.items():
              report.append(f"| {labels[slug]} | {result['status']} | {result['downloaded']} | {result['usable']} |")
          report.append('')
          report.append('## Interpretação')
          report.append('- **OK**: a pasta foi acessada e as imagens foram processadas.')
          report.append('- **FAILED_OR_EMPTY**: o GitHub Actions não conseguiu obter imagens acessíveis da pasta nesta execução; a galeria anterior foi preservada.')
          report.append('')

          (root / 'drive-sync-report.md').write_text('\n'.join(report) + '\n', encoding='utf-8')

          summary = []
          summary.append('## Resultado da sincronização do Drive')
          for slug, result in results.items():
              summary.append(f"- **{labels[slug]}**: `{result['status']}` — {result['downloaded']} arquivos encontrados, {result['usable']} processados.")
          summary.append('')
          summary.append('Relatório completo: `drive-sync-report.md`')
          pathlib.Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(summary) + '\n', encoding='utf-8')

          # Keep the existing verified local cover images and fix known extensions.
          index = root / 'index.html'
          event = root / 'event.html'
          for p in [index, event]:
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              for slug in ['the-grid-outworld','adriatique-x-sao-paulo','crochestra-brasil','one-life-sao-paulo','unreal-the-grid']:
                  s = s.replace(f'assets/covers/{slug}.webp', f'assets/covers/{slug}.jpg')
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit synchronization results and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/galleries drive-sync-report.md index.html event.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "sync: import up to 20 Drive photos and publish diagnostics [drive-gallery-sync]"
          git push
