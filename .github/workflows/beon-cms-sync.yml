name: BeOn CMS Sync
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/beon-cms-sync.yml'
      - 'assets/beon-v4.js'
      - 'assets/beon-event-v4.js'
      - 'assets/admin-v4-route.js'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: beon-cms-sync
  cancel-in-progress: true
jobs:
  deploy:
    if: ${{ !contains(github.event.head_commit.message, '[beon-cms]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Injetar camadas CMS e rota Admin V4
        shell: python
        env:
          SHA: ${{ github.sha }}
        run: |
          from pathlib import Path
          import os, re
          sha=os.environ['SHA']
          for file, scripts in {
              'index.html': ['assets/admin-v4-route.js','assets/beon-v4.js'],
              'event.html': ['assets/beon-event-v4.js']
          }.items():
              p=Path(file)
              if not p.exists():
                  continue
              html=p.read_text(encoding='utf-8')
              for src in scripts:
                  html=re.sub(r'<script[^>]+src=["\']'+re.escape(src)+r'(?:\?[^"\']*)?["\'][^>]*></script>\s*','',html,flags=re.I)
                  tag=f'<script src="{src}?v={sha}" defer></script>'
                  html=html.replace('</body>', tag+'\n</body>', 1)
              p.write_text(html,encoding='utf-8')
      - name: Validar integração
        shell: bash
        run: |
          grep -F 'assets/admin-v4-route.js' index.html
          grep -F 'assets/beon-v4.js' index.html
          grep -F 'assets/beon-event-v4.js' event.html
      - name: Publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html event.html
          git diff --cached --quiet || git commit -m 'feat: ativar rota Admin V4 [beon-cms]'
          git push
