name: BeOn CMS Sync
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/beon-cms-sync.yml'
      - 'assets/beon-v4.js'
      - 'assets/beon-event-v4.js'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: beon-cms-sync
  cancel-in-progress: true
jobs:
  deploy:
    if: ${{ !contains(github.event.head_commit.message, '[beon-cms]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - name: Injetar camada CMS sem alterar a interface existente
        shell: python
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          import os
          from pathlib import Path
          sha=os.environ['GITHUB_SHA']
          for file, src, marker in [('index.html','assets/beon-v4.js','beon-v4.js'),('event.html','assets/beon-event-v4.js','beon-event-v4.js')]:
              p=Path(file)
              if not p.exists(): continue
              html=p.read_text(encoding='utf-8')
              html='\n'.join(line for line in html.splitlines() if marker not in line)
              tag=f'<script src="{src}?v={sha}" defer></script>'
              html=html.replace('</body>',tag+'\n</body>',1)
              p.write_text(html,encoding='utf-8')
      - name: Validar integração
        shell: bash
        run: |
          grep -F 'assets/beon-v4.js' index.html
          grep -F 'assets/beon-event-v4.js' event.html
      - name: Publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html event.html
          git diff --cached --quiet || git commit -m 'feat: ativar CMS Supabase BeOn [beon-cms]'
          git push