name: Finalize ambassador presentation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-profile-presentation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[final-presentation]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install exact uploaded profile photo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          cat > /tmp/profile.b64 <<'B64'
