name: Apply final visual fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-final-visual-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply requested visual corrections
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          # 1) Put BE·ON AMBASSADOR immediately before the hero block,
          #    which puts it directly above the “Line-ups selecionados” label.
          amb_re = re.compile(r'<section class="amb-wrap w">.*?</section>', re.S)
          m = amb_re.search(html)
          if m:
              amb = m.group(0)
              html = html[:m.start()] + html[m.end():]
              hero_marker = '<section class="hero w">'
              if hero_marker in html:
                  html = html.replace(hero_marker, amb + hero_marker, 1)

          # 2) Use the exact profile photo supplied by Matheus, stored in the repo.
          html = html.replace('https://unavatar.io/instagram/mat_mascena97', 'assets/profile-matheus.svg')
          html = html.replace('src="profile-photo.svg"', 'src="assets/profile-matheus.svg"')

          # 3) Add a dedicated, highly visible coupon badge under the name.
          if 'class="profile-code-badge"' not in html:
              html = html.replace(
                  '<h3>Matheus Alves Mascena — 29 anos.</h3>',
                  '<h3>Matheus Alves Mascena — 29 anos.</h3><div class="profile-code-badge">CUPOM: <strong>MATHEUSMASCENA</strong> · 5% OFF</div>',
                  1,
              )

          # 4) Override the previous visual rules without touching event content.
          fixes = '''<style id="final-layout-fixes-v2">
          .amb-wrap{padding:18px 0 8px;text-align:center}
          .amb{display:inline-flex;flex-direction:column;padding:10px 22px;border:1px solid #3fe0d055;border-radius:16px;background:linear-gradient(135deg,#7c5cff18,#ff2f9210);box-shadow:0 0 24px #7c5cff15;text-transform:uppercase}
          .amb small{font-size:8px;letter-spacing:.22em;color:var(--c)}
          .amb strong{font:22px 'Bebas Neue';letter-spacing:.08em}
          .profile{grid-template-columns:200px minmax(0,1fr);gap:34px;padding:30px;align-items:center}
          .profile-photo{width:200px;height:200px;object-fit:contain;object-position:center;background:#0e0a17;border-radius:18px;border:2px solid #3fe0d077;display:block;padding:0}
          .profile>div:last-child{text-align:left;min-width:0}
          .profile h3{margin:4px 0 8px;color:var(--c);text-shadow:0 0 18px #3fe0d055}
          .profile-code-badge{display:inline-block;margin:0 0 14px;padding:7px 11px;border:1px solid #ff2f9255;border-radius:9px;background:#ff2f9212;color:var(--m);font-size:10px;font-weight:700;letter-spacing:.04em}
          .profile-code-badge strong{color:var(--m);font-weight:800}
          .profile p{margin:0 0 18px;line-height:1.75}
          .cards{align-items:stretch}
          .cards .card{height:100%;min-height:460px;display:flex;flex-direction:column}
          .cards .pic{height:220px;flex:none;overflow:hidden;background:#0e0a17;display:flex;align-items:center;justify-content:center}
          .cards .pic img{width:100%;height:100%;object-fit:contain!important;object-position:center;display:block;transition:.4s;image-rendering:auto}
          .cards .body{flex:1;display:flex;flex-direction:column}
          .cards .acts{margin-top:auto;padding-top:14px}
          .next .ni .count{margin-bottom:18px}
          .next .ni>.buy{display:block;margin-top:6px}
          @media(max-width:760px){
            .amb-wrap{padding:14px 0 6px}
            .profile{grid-template-columns:1fr;gap:18px;padding:22px;text-align:center}
            .profile-photo{width:160px;height:160px;margin:auto}
            .profile>div:last-child{text-align:center}
            .profile p{line-height:1.65}
            .profile .links{justify-content:center}
            .cards .pic{height:230px}
          }
          </style>'''
          if 'id="final-layout-fixes-v2"' not in html:
              html = html.replace('</head>', fixes + '</head>', 1)

          p.write_text(html, encoding='utf-8')
          print('Requested BeOn visual corrections applied.')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Apply ambassador photo and layout corrections"
          git push
