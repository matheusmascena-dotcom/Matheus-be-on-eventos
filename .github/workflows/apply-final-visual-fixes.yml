name: Apply final ambassador fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-final-visual-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download optimized profile photo and repair references
        shell: bash
        run: |
          set -e
          mkdir -p assets
          curl -L --fail --retry 3 --connect-timeout 15 --max-time 45 'https://unavatar.io/instagram/mat_mascena97' -o assets/matheus-profile.jpg
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('https://www.instagram.com/matheusmascena/','https://www.instagram.com/mat_mascena97/')
          s=re.sub(r'https://wa\\.me/\\?text=[^"\'<> ]*','https://w.app/matheusalves-fale-comigo',s)
          s=s.replace('src="profile-photo.svg"','src="assets/matheus-profile.jpg" width="170" height="240" loading="eager" fetchpriority="high" decoding="async"')
          s=s.replace('src="assets/profile-matheus.svg"','src="assets/matheus-profile.jpg" width="170" height="240" loading="eager" fetchpriority="high" decoding="async"')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit definitive profile/contact fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/matheus-profile.jpg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: correct Instagram WhatsApp and profile photo [profile-contact-fix]'
          git push
