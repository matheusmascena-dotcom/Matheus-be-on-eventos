name: Force sync Drive galleries

on:
  push:
    paths:
      - '.github/workflows/drive-gallery-force-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[drive-gallery-force-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install gdown and Pillow
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install gdown pillow

      - name: Download and register up to 20 photos per event
        env:
          MAX_PHOTOS: '20'
          MUSIC_ON_DRIVE: 'https://drive.google.com/drive/folders/12fRYhu6hrB8qkIEjTRtMX0-AnSQeyJXO?usp=sharing'
          ONE_LIFE_DRIVE: 'https://drive.google.com/drive/folders/11FUlmMiVFobyh8O_FYjaScR9AkXfqkrh?usp=sharing'
          THE_GRID_DRIVE: 'https://drive.google.com/drive/folders/1HL4FvP5ABw9__7yuSHe_DZA1FwANSTEk?usp=sharing'
          ADRIATIQUE_DRIVE: 'https://drive.google.com/drive/folders/1Cq11QSAfy7gTTgpri4kGjvnJrWcs9nGJ?usp=sharing'
          CROCHESTRA_DRIVE: 'https://drive.google.com/drive/folders/1QixvAOaAHKh5Vp91GyrDCWmHQG6l6jhz?usp=drive_link'
        run: |
          python3 - <<'PY'
          import os, json, shutil, subprocess, pathlib
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          from PIL import Image

          root = pathlib.Path('.')
          base = root/'assets'/'galleries'
          base.mkdir(parents=True, exist_ok=True)
          maximum = int(os.environ['MAX_PHOTOS'])

          events = {
            'music-on-sao-paulo': (os.environ['MUSIC_ON_DRIVE'], [
              {'label':'BeOn Entertainment','instagram':'https://www.instagram.com/beonentertainment/','icon':'📷'},
              {'label':'@clickdoclayton','instagram':'https://www.instagram.com/clickdoclayton/','icon':'📷'}
            ]),
            'one-life-sao-paulo': (os.environ['ONE_LIFE_DRIVE'], [
              {'label':'BeOn Entertainment','instagram':'https://www.instagram.com/beonentertainment/','icon':'📷'}
            ]),
            'the-grid-outworld': (os.environ['THE_GRID_DRIVE'], [
              {'label':'BeOn Entertainment','instagram':'https://www.instagram.com/beonentertainment/','icon':'📷'},
              {'label':'@pedrofatore_','instagram':'https://www.instagram.com/pedrofatore_/','icon':'📷'}
            ]),
            'adriatique-x-sao-paulo': (os.environ['ADRIATIQUE_DRIVE'], [
              {'label':'BeOn Entertainment','instagram':'https://www.instagram.com/beonentertainment/','icon':'📷'},
              {'label':'@pedrofatore_','instagram':'https://www.instagram.com/pedrofatore_/','icon':'📷'}
            ]),
            'crochestra-brasil': (os.environ['CROCHESTRA_DRIVE'], [])
          }

          labels = {
            'music-on-sao-paulo':'Music On',
            'one-life-sao-paulo':'One Life',
            'the-grid-outworld':'The Grid',
            'adriatique-x-sao-paulo':'Adriatique',
            'crochestra-brasil':'Crochestra'
          }

          results = {}
          for slug, (url, credits) in events.items():
              tmp = pathlib.Path('/tmp/'+slug)
              if tmp.exists(): shutil.rmtree(tmp)
              tmp.mkdir(parents=True)

              probe = {}
              try:
                  req = Request(url, headers={'User-Agent':'Mozilla/5.0'})
                  with urlopen(req, timeout=30) as r:
                      probe = {'http':r.status, 'content_type':r.headers.get('content-type',''), 'final_url':r.geturl()}
              except Exception as e:
                  probe = {'http':'ERROR','content_type':'','final_url':url,'error':str(e)}

              cmd = ['gdown','--folder',url,'--output',str(tmp)]
              proc = subprocess.run(cmd, text=True, capture_output=True)
              files = []
              if proc.returncode == 0:
                  files = [p for p in tmp.rglob('*') if p.is_file() and p.suffix.lower() in {'.jpg','.jpeg','.png','.webp','.gif','.bmp'}]
                  files.sort(key=lambda p:p.name.lower())

              stage = pathlib.Path('/tmp/stage_'+slug)
              if stage.exists(): shutil.rmtree(stage)
              stage.mkdir(parents=True)
              count = 0
              for src in files[:maximum]:
                  try:
                      Image.open(src).convert('RGB').save(stage/f'{count+1:02d}.jpg','JPEG',quality=94,optimize=True,progressive=True)
                      count += 1
                  except Exception:
                      pass

              if count:
                  dest = base/slug
                  if dest.exists(): shutil.rmtree(dest)
                  stage.rename(dest)
                  payload = {
                      'photos':[{'src':f'assets/galleries/{slug}/{i:02d}.jpg','name':f'{i:02d}'} for i in range(1,count+1)],
                      'credits':credits,
                      'sourceFolder':url,
                      'warning':None,
                      'importedCount':count
                  }
                  (base/f'{slug}.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

              results[slug] = {
                  'status':'OK' if count else 'FAILED_OR_EMPTY',
                  'http':probe.get('http'),
                  'content_type':probe.get('content_type'),
                  'files':len(files),
                  'processed':count,
                  'gdown_exit':proc.returncode,
                  'stderr':(proc.stderr or '')[-2500:]
              }

          lines = ['# Drive sync report','',f'Max photos imported per event: **{maximum}**','', '| Event | Status | HTTP | Files | Processed | gdown |','|---|---|---:|---:|---:|---:|']
          for slug, r in results.items():
              lines.append(f"| {labels[slug]} | {r['status']} | {r['http']} | {r['files']} | {r['processed']} | {r['gdown_exit']} |")
          lines += ['', '## Errors']
          for slug, r in results.items():
              lines += [f"### {labels[slug]}", f"HTTP: `{r['http']}`", f"Content-Type: `{r['content_type']}`", '```text', r['stderr'] or '(none)', '```', '']
          (root/'drive-sync-report.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          summary = ['## Drive sync']
          for slug,r in results.items():
              summary.append(f"- **{labels[slug]}**: {r['status']} — HTTP {r['http']}, {r['files']} files, {r['processed']} processed.")
          pathlib.Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(summary)+'\n',encoding='utf-8')
          PY

      - name: Commit imported photos and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/galleries drive-sync-report.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "sync: import Drive galleries [drive-gallery-force-sync]"
          git push
