name: BeOn V3 professional UI and Supabase admin

on:
  push:
    paths:
      - 'assets/galleries/**'
      - '.github/workflows/show-all-gallery-photos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[beon-v3]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply BeOn V3 experience
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          SUPA_URL='https://bellpluuhrrluwsgouob.supabase.co'
          SUPA_KEY='sb_publishable_oQq38KO1A-4mZttQVL6O-g__RZKKIGX'

          v3_style='''<style id="beon-v3-style">
          :root{--v3-glow:#7c5cff;--v3-cyan:#3fe0d0;--v3-pink:#ff2f92}
          .v3-bottom{display:none}
          @media(max-width:760px){.v3-bottom{position:fixed;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:90;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:8px;border:1px solid #ffffff18;border-radius:20px;background:#08060df2;backdrop-filter:blur(18px);box-shadow:0 16px 50px #0009}.v3-bottom a,.v3-bottom button{border:0;background:none;color:#9d95b1;text-align:center;font:600 10px/1.1 'Space Grotesk',sans-serif;padding:7px 4px;border-radius:12px}.v3-bottom .active,.v3-bottom a:hover,.v3-bottom button:hover{color:#fff;background:#7c5cff22;box-shadow:inset 0 0 0 1px #7c5cff33}.v3-bottom small{display:block;font-size:17px;margin-bottom:3px}.v3-page-pad{padding-bottom:88px!important}}
          .v3-fav{position:absolute;right:9px;bottom:9px;z-index:10;width:34px;height:34px;border:1px solid #ffffff22;border-radius:50%;background:#08060dcc;color:#fff;cursor:pointer;font-size:18px;box-shadow:0 0 20px #0006}.v3-fav.on{color:#ff2f92;border-color:#ff2f9255;box-shadow:0 0 20px #ff2f9230}
          .card.v3-tilt{transform-style:preserve-3d;will-change:transform}.card.v3-tilt .pic:after{pointer-events:none}
          .v3-share{border:1px solid #3fe0d055;color:#3fe0d0;background:transparent}.v3-share:hover{border-color:#3fe0d099;box-shadow:0 0 24px #3fe0d01c}
          .v3-search-ring{box-shadow:0 0 0 3px #7c5cff10,0 0 30px #7c5cff18!important}
          .v3-filter-chip{display:inline-flex;align-items:center;padding:7px 10px;margin:4px;border:1px solid #ffffff18;border-radius:999px;color:#aaa1b8;background:#0c0913;font-size:11px;cursor:pointer}.v3-filter-chip.on{color:#fff;border-color:#7c5cff66;background:#7c5cff18}
          .v3-count .unit b{perspective:600px;transform-origin:center;transition:transform .2s,filter .2s}.v3-count .unit.flip b{animation:v3flip .28s ease}@keyframes v3flip{50%{transform:rotateX(-90deg);filter:brightness(1.8)}}
          .v3-map{margin-top:18px;border:1px solid #ffffff14;border-radius:18px;overflow:hidden;background:#0b0812}.v3-map-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;color:#fff;font-weight:700}.v3-map iframe{display:block;width:100%;height:250px;border:0;filter:saturate(.82) contrast(1.05) brightness(.78)}
          .v3-admin{position:fixed;inset:0;z-index:200;background:#07050bf7;backdrop-filter:blur(18px);overflow:auto;display:none}.v3-admin.on{display:block}.v3-admin .wrap{max-width:1100px;margin:auto;padding:24px}.v3-admin h1{font:48px/1 'Bebas Neue';margin:5px 0 16px}.v3-admin .panel{border:1px solid #ffffff14;border-radius:18px;background:#110d1a;padding:18px;box-shadow:0 20px 60px #0007;margin-bottom:16px}.v3-admin input,.v3-admin textarea,.v3-admin select{width:100%;padding:11px;border:1px solid #ffffff18;border-radius:10px;background:#08060d;color:#fff;font:14px 'Space Grotesk',sans-serif}.v3-admin textarea{min-height:90px;resize:vertical}.v3-admin .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.v3-admin .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.v3-admin button{border:0;border-radius:10px;padding:11px 14px;background:#f1edf7;color:#090711;font-weight:700;cursor:pointer}.v3-admin .ghost{background:#ffffff08;color:#fff;border:1px solid #ffffff18}.v3-admin .danger{background:#ff2f9220;color:#ff91bb;border:1px solid #ff2f9244}.v3-admin table{width:100%;border-collapse:collapse;font-size:12px}.v3-admin th,.v3-admin td{padding:9px;border-bottom:1px solid #ffffff0d;text-align:left;vertical-align:top}.v3-admin .status{color:#3fe0d0;font-size:12px;min-height:18px}@media(max-width:760px){.v3-admin .wrap{padding:14px}.v3-admin h1{font-size:38px}.v3-admin .grid2{grid-template-columns:1fr}.v3-map iframe{height:220px}}
          </style>'''

          bottom='''<nav class="v3-bottom" aria-label="Navegação móvel"><a href="index.html#top"><small>⌂</small>Início</a><button type="button" data-v3-search><small>⌕</small>Buscar</button><a href="index.html#eventos"><small>🎫</small>Eventos</a><a href="index.html?favorites=1#eventos"><small>♥</small>Favoritos</a><a href="https://wa.me/?text=Eventos%20BeOn%20-%20MATHEUSMASCENA" target="_blank" rel="noopener"><small>💬</small>WhatsApp</a></nav>'''

          index_js=f'''<script id="beon-v3-script">(()=>{{
          const KEY='beon-favorites-v3';
          const loadFav=()=>JSON.parse(localStorage.getItem(KEY)||'[]');
          const saveFav=a=>localStorage.setItem(KEY,JSON.stringify(a));
          const path=location.pathname, params=new URLSearchParams(location.search);
          function toast(msg){{let t=document.getElementById('v3-toast');if(!t){{t=document.createElement('div');t.id='v3-toast';t.style='position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:150;padding:10px 14px;border:1px solid #ffffff18;border-radius:999px;background:#090711f5;color:#fff;font:600 12px Space Grotesk, sans-serif;box-shadow:0 15px 45px #0008';document.body.appendChild(t)}}t.textContent=msg;t.style.opacity='1';clearTimeout(t._x);t._x=setTimeout(()=>t.style.opacity='0',1800)}}
          function share(url,title){{if(navigator.share) navigator.share({{title,url}}).catch(()=>{{}}); else navigator.clipboard?.writeText(url).then(()=>toast('Link copiado'))}}
          function wireIndex(){{
            document.body.classList.add('v3-page-pad');
            const search=document.querySelector('.search input');
            if(search){{search.classList.add('v3-search-ring');search.placeholder='Buscar por evento, artista, local ou mês...';search.addEventListener('input',()=>filterCards(search.value))}}
            const cards=[...document.querySelectorAll('.cards .card')];const favs=loadFav();
            cards.forEach(card=>{{const link=card.querySelector('a[href*="event.html?event="]');if(!link)return;const slug=new URL(link.href,location.href).searchParams.get('event');card.dataset.slug=slug;card.classList.add('v3-tilt');
              const btn=document.createElement('button');btn.className='v3-fav';btn.type='button';btn.title='Favoritar';btn.textContent=favs.includes(slug)?'♥':'♡';if(favs.includes(slug))btn.classList.add('on');btn.onclick=e=>{{e.stopPropagation();let a=loadFav();if(a.includes(slug)){{a=a.filter(x=>x!==slug);btn.classList.remove('on');btn.textContent='♡';toast('Removido dos favoritos')}}else{{a.push(slug);btn.classList.add('on');btn.textContent='♥';toast('Adicionado aos favoritos')}}saveFav(a)}};card.querySelector('.pic')?.appendChild(btn);
              card.addEventListener('mousemove',e=>{{const r=card.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;card.style.transform=`perspective(900px) rotateX(${{-y*5}}deg) rotateY(${{x*6}}deg) translateY(-4px)`}});card.addEventListener('mouseleave',()=>card.style.transform='');
            }});
            if(params.get('favorites')==='1') setTimeout(()=>filterFavorites(),100);
            const sb=document.createElement('button');sb.className='v3-share';sb.textContent='↗ Compartilhar';sb.style='display:inline-block;margin:0 0 14px 8px;padding:10px 13px;border-radius:10px;font:700 11px Space Grotesk';sb.onclick=()=>share(location.href,'Eventos BeOn');document.querySelector('.head')?.appendChild(sb);
            document.querySelectorAll('[data-v3-search]').forEach(b=>b.onclick=()=>{{search?.scrollIntoView({{behavior:'smooth',block:'center'}});setTimeout(()=>search?.focus(),350)}});
          }}
          function filterCards(q){{const term=q.toLowerCase().trim();document.querySelectorAll('.cards .card').forEach(c=>c.style.display=(!term||c.textContent.toLowerCase().includes(term))?'':'none')}}
          function filterFavorites(){{const f=loadFav();document.querySelectorAll('.cards .card').forEach(c=>c.style.display=f.includes(c.dataset.slug)?'':'none')}}
          function wireEvent(){{
            document.body.classList.add('v3-page-pad');
            const slug=new URLSearchParams(location.search).get('event');
            const fav=loadFav();
            const actions=document.querySelector('.actions');
            if(actions){{const b=document.createElement('button');b.type='button';b.className='btn v3-share';b.textContent='↗ Compartilhar';b.onclick=()=>share(location.href,document.getElementById('name')?.textContent||'Evento BeOn');actions.appendChild(b);const f=document.createElement('button');f.type='button';f.className='btn v3-share';f.textContent=fav.includes(slug)?'♥ Favoritado':'♡ Favoritar';f.onclick=()=>{{let a=loadFav();if(a.includes(slug)){{a=a.filter(x=>x!==slug);f.textContent='♡ Favoritar';toast('Removido dos favoritos')}}else{{a.push(slug);f.textContent='♥ Favoritado';toast('Adicionado aos favoritos')}}saveFav(a)}};actions.appendChild(f)}}
            const count=document.querySelector('.count');count?.classList.add('v3-count');const old=count?.querySelectorAll('.unit b')||[];let last=['','','',''];const tickOrig=window.tick;const t=()=>{{let x=Math.max(0,new Date(window.ev?.[2]||Date.now()).getTime()-Date.now()),d=Math.floor(x/86400000);x%=86400000;let h=Math.floor(x/3600000);x%=3600000;let m=Math.floor(x/60000),s=Math.floor(x/1000)%60;const vals=[d,h,m,s];old.forEach((el,i)=>{{const val=String(vals[i]).padStart(2,'0');if(last[i]&&last[i]!==val)el.closest('.unit')?.classList.remove('flip'),void el.offsetWidth,el.closest('.unit')?.classList.add('flip');el.textContent=val;last[i]=val}})}};t();setInterval(t,1000);
            const local=document.getElementById('local')?.textContent||'';const map=document.createElement('section');map.className='v3-map';map.innerHTML=`<div class="v3-map-head"><span>📍 Localização</span><a class="v3-share" style="padding:8px 10px;border-radius:8px;font-size:10px" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${{encodeURIComponent(local)}}">Abrir no Maps ↗</a></div><iframe loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://www.google.com/maps?q=${{encodeURIComponent(local)}}&output=embed"></iframe>`;document.querySelector('.hero')?.after(map);
            document.querySelectorAll('[data-v3-search]').forEach(b=>b.onclick=()=>location.href='index.html?focus=search#eventos');
          }}
          function wireAdmin(){{if(params.get('admin')!=='1')return;document.body.innerHTML=`<div class="v3-admin on" id="v3-admin"><div class="wrap"><div class="panel"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><div style="color:#3fe0d0;font-size:11px;letter-spacing:.15em;text-transform:uppercase">BeOn 3.0</div><h1>Painel administrativo</h1><div class="status" id="admStatus">Faça login com uma conta do Supabase Auth.</div></div><button class="ghost" id="admClose">Fechar</button></div></div><div class="panel" id="loginPanel"><div class="grid2"><input id="admEmail" placeholder="E-mail"><input id="admPass" type="password" placeholder="Senha"></div><div class="actions"><button id="admLogin">Entrar</button></div></div><div class="panel" id="appPanel" style="display:none"><div class="actions"><button id="newEvent">Novo evento</button><button class="ghost" id="logout">Sair</button></div><div class="panel" style="margin-top:12px"><div class="grid2"><input id="fName" placeholder="Nome"><input id="fDate" type="date"><input id="fLocation" placeholder="Local"><input id="fArtists" placeholder="Artistas / line-up"><input id="fPurchase" placeholder="Link de compra"><input id="fImage" placeholder="URL da capa"><input id="fSource" placeholder="Pasta do Drive / fonte"><select id="fPublished"><option value="true">Publicado</option><option value="false">Oculto</option></select><select id="fFeatured"><option value="false">Não destacado</option><option value="true">Destacado</option></select></div><textarea id="fDescription" placeholder="Descrição"></textarea><div class="actions"><button id="saveEvent">Salvar</button><button class="ghost" id="cancelEdit">Cancelar</button></div></div><div id="eventTable"></div></div></div></div>`;document.getElementById('admClose').onclick=()=>location.href='index.html';
            const sb=window.supabase.createClient('${{SUPA_URL}}','${{SUPA_KEY}}');let editing=null;
            const $=id=>document.getElementById(id);function status(t,err=false){{$('admStatus').textContent=t;$('admStatus').style.color=err?'#ff8fb9':'#3fe0d0'}}
            function clearForm(){{editing=null;['fName','fDate','fLocation','fArtists','fPurchase','fImage','fSource','fDescription'].forEach(id=>$(id).value='');$('fPublished').value='true';$('fFeatured').value='false'}}
            function fill(e){{editing=e.id;$('fName').value=e.name||'';$('fDate').value=e.event_date||'';$('fLocation').value=e.location||'';$('fArtists').value=e.artists||'';$('fPurchase').value=e.purchase_url||'';$('fImage').value=e.image_url||'';$('fSource').value=e.source_url||'';$('fDescription').value=e.description||'';$('fPublished').value=String(e.published);$('fFeatured').value=String(e.featured)}}
            async function load(){{const {{data,error}}=await sb.from('events').select('*').order('event_date');if(error)return status(error.message,true);$('eventTable').innerHTML=`<table><thead><tr><th>Evento</th><th>Data</th><th>Publicado</th><th>Ações</th></tr></thead><tbody>${{data.map(e=>`<tr><td>${{e.name}}</td><td>${{e.event_date||''}}</td><td>${{e.published?'Sim':'Não'}}</td><td><button data-edit="${{e.id}}" class="ghost">Editar</button> <button data-del="${{e.id}}" class="danger">Excluir</button></td></tr>`).join('')}}</tbody></table>`;document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>fill(data.find(x=>x.id===b.dataset.edit)));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{{if(!confirm('Excluir este evento?'))return;const r=await sb.from('events').delete().eq('id',b.dataset.del);if(r.error)status(r.error.message,true);else{{status('Evento excluído');load()}}}})}}
            $('admLogin').onclick=async()=>{{const r=await sb.auth.signInWithPassword({{email:$('admEmail').value,password:$('admPass').value}});if(r.error)return status(r.error.message,true);$('loginPanel').style.display='none';$('appPanel').style.display='block';status('Login realizado');load()}};
            $('logout').onclick=async()=>{{await sb.auth.signOut();location.reload()}};$('newEvent').onclick=clearForm;$('cancelEdit').onclick=clearForm;$('saveEvent').onclick=async()=>{{const payload={{name:$('fName').value,event_date:$('fDate').value,location:$('fLocation').value,artists:$('fArtists').value,purchase_url:$('fPurchase').value,image_url:$('fImage').value,source_url:$('fSource').value,description:$('fDescription').value,published:$('fPublished').value==='true',featured:$('fFeatured').value==='true',slug:$('fName').value.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')}};const r=editing?await sb.from('events').update(payload).eq('id',editing):await sb.from('events').insert(payload);if(r.error)status(r.error.message,true);else{{status('Evento salvo no Supabase');clearForm();load()}}}};
            }}
          }}
          document.addEventListener('DOMContentLoaded',()=>{{const head=document.head;head.insertAdjacentHTML('beforeend',`${{v3_style}}`);if(path.endsWith('event.html')){{document.body.insertAdjacentHTML('beforeend',`${{bottom}}`);wireEvent()}}else if(!params.get('admin')){{document.body.insertAdjacentHTML('beforeend',`${{bottom}}`);wireIndex();if(params.get('focus')==='search')setTimeout(()=>document.querySelector('.search input')?.focus(),500)}};wireAdmin();}});
          }})();</script>'''

          for name in ['index.html','event.html']:
              p=Path(name)
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8')
              if 'beon-v3-style' not in s:
                  # Load Supabase JS only where admin mode is requested, but leave library available for the shared script.
                  s=s.replace('</head>','<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>',1)
                  s=s.replace('</body>',v3_style+bottom+index_js+'</body>',1)
                  p.write_text(s,encoding='utf-8')
          PY

      - name: Commit BeOn V3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html event.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: BeOn V3 professional mobile, favorites, sharing, maps and admin [beon-v3]"
          git push
