name: Keep full event galleries in lightbox

on:
  push:
    paths:
      - 'assets/galleries/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show 8 thumbnails and keep all photos in lightbox
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('event.html')
          s = p.read_text(encoding='utf-8')
          old = "photos=(g.photos||[]).slice(0,8);const grid=document.getElementById('beon-gallery-grid')"
          new = "photos=(g.photos||[]);const visiblePhotos=photos.slice(0,8);const grid=document.getElementById('beon-gallery-grid')"
          if old in s:
              s = s.replace(old, new, 1)
          s = s.replace("photos.forEach((p,i)=>{const a=document.createElement('a')", "visiblePhotos.forEach((p,i)=>{const a=document.createElement('a')", 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit UI change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add event.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: show 8 thumbnails and all photos in lightbox"
          git push
