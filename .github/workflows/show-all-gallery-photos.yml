name: Keep full event galleries in lightbox

on:
  push:
    paths:
      - 'assets/galleries/**'
  workflow_dispatch:

permissions:
  contents: write

# v3 - gallery + ambassador profile/contact repair
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[profile-contact-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show 8 thumbnails and keep all photos in lightbox
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('event.html')
          s = p.read_text(encoding='utf-8')
          old = "photos=(g.photos||[]).slice(0,8);const grid=document.getElementById('beon-gallery-grid')"
          new = "photos=(g.photos||[]);const visiblePhotos=photos.slice(0,8);const grid=document.getElementById('beon-gallery-grid')"
          if old in s:
              s = s.replace(old, new, 1)
          s = s.replace("photos.forEach((p,i)=>{const a=document.createElement('a')", "visiblePhotos.forEach((p,i)=>{const a=document.createElement('a')", 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Download optimized Instagram profile photo and fix contacts
        run: |
          set -e
          mkdir -p assets
          curl -L --fail --retry 3 --connect-timeout 15 --max-time 45 'https://unavatar.io/instagram/mat_mascena97' -o assets/matheus-profile.jpg
          python3 - <<'PY'
          from pathlib import Path
          import re
          instagram='https://www.instagram.com/mat_mascena97/'
          whatsapp='https://w.app/matheusalves-fale-comigo'
          for name in ('index.html','event.html'):
              p=Path(name)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              s=s.replace('https://www.instagram.com/matheusmascena/', instagram)
              s=re.sub(r'https://wa\\.me/\\?text=[^"\'<> ]*', whatsapp, s)
              s=s.replace('src="profile-photo.svg"','src="assets/matheus-profile.jpg" width="170" height="240" loading="eager" fetchpriority="high" decoding="async"')
              p.write_text(s,encoding='utf-8')
          PY

      - name: Commit UI/contact/photo changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html event.html assets/matheus-profile.jpg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: correct Instagram WhatsApp and local profile photo [profile-contact-fix]'
          git push
