name: Fast apply admin cover upload

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fast-admin-cover-upload.yml'

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Patch admin-v4 via contents API
        shell: bash
        run: |
          set -euo pipefail
          repo='${{ github.repository }}'
          json=$(gh api "repos/$repo/contents/admin-v4.html?ref=main")
          sha=$(python -c "import json,sys; print(json.load(sys.stdin)['sha'])" <<< "$json")
          content=$(python -c "import base64,json,sys; print(base64.b64decode(json.load(sys.stdin)['content']).decode())" <<< "$json")
          tag='<script src="assets/admin-image-upload-v1.js?v=1"></script>'
          if [[ "$content" != *"$tag"* ]]; then
            content="${content%</body>}${tag}</body>"
          fi
          b64=$(printf '%s' "$content" | base64 -w 0)
          gh api --method PUT "repos/$repo/contents/admin-v4.html" \
            -f message='feat: habilitar upload de capa no admin' \
            -f content="$b64" \
            -f sha="$sha" \
            -f branch='main' >/dev/null
      - name: Remove this workflow
        shell: bash
        run: |
          repo='${{ github.repository }}'
          json=$(gh api "repos/$repo/contents/.github/workflows/fast-admin-cover-upload.yml?ref=main")
          sha=$(python -c "import json,sys; print(json.load(sys.stdin)['sha'])" <<< "$json")
          gh api --method DELETE "repos/$repo/contents/.github/workflows/fast-admin-cover-upload.yml" \
            -f message='chore: remove one-time fast admin cover workflow' \
            -f sha="$sha" \
            -f branch='main' >/dev/null
